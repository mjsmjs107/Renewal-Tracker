function initPIN(){const a=localStorage.getItem(ACT_KEY),p=localStorage.getItem(PIN_KEY);if(!a&&!p){document.getElementById('activate-screen').style.display='';document.getElementById('pin-screen').style.display='none';return}document.getElementById('activate-screen').style.display='none';document.getElementById('pin-screen').style.display='';if(!p){pinMode='setup';document.getElementById('pin-msg').textContent='Create a 4-digit PIN'}else{pinMode='unlock';document.getElementById('pin-msg').textContent='Enter your PIN'}pinBuffer=[];updateDots();document.getElementById('pin-error').textContent=''}
function handlePinKey(k){const err=document.getElementById('pin-error');err.textContent='';if(k==='clear'){pinBuffer=[];updateDots();return}if(k==='ok'){const pin=pinBuffer.join('');if(pin.length<4){err.textContent='Enter 4 digits';return}if(pinMode==='setup'){pinSetupValue=pin;pinMode='confirm';document.getElementById('pin-msg').textContent='Confirm PIN';pinBuffer=[];updateDots();return}if(pinMode==='confirm'){if(pin===pinSetupValue){localStorage.setItem(PIN_KEY,pin);unlockApp();toast('PIN created')}else{showPinError("PINs don't match");pinMode='setup';document.getElementById('pin-msg').textContent='Create a 4-digit PIN'}pinBuffer=[];updateDots();return}if(pinMode==='unlock'){if(pin===localStorage.getItem(PIN_KEY))unlockApp();else{showPinError('Wrong PIN');pinBuffer=[];updateDots()}return}if(pinMode==='change'){pinSetupValue=pin;pinMode='change-confirm';document.getElementById('pin-msg').textContent='Confirm new PIN';pinBuffer=[];updateDots();return}if(pinMode==='change-confirm'){if(pin===pinSetupValue){localStorage.setItem(PIN_KEY,pin);unlockApp();toast('PIN changed')}else{showPinError("PINs don't match");pinMode='change';document.getElementById('pin-msg').textContent='Enter new PIN'}pinBuffer=[];updateDots();return}return}if(pinBuffer.length<4){pinBuffer.push(k);updateDots()}}
function updateDots(){document.querySelectorAll('#pin-dots .dc').forEach((d,i)=>{d.classList.toggle('filled',i<pinBuffer.length);d.classList.remove('error')})}
function showPinError(m){document.getElementById('pin-error').textContent=m;document.querySelectorAll('#pin-dots .dc').forEach(d=>{d.classList.add('error');d.classList.remove('filled')});setTimeout(()=>document.querySelectorAll('#pin-dots .dc').forEach(d=>d.classList.remove('error')),500);pinBuffer=[]}
function unlockApp(){document.getElementById('pin-screen').style.display='none';document.getElementById('app-main').style.display=''}
function showPinScreen(m){pinMode=m||'unlock';pinBuffer=[];pinSetupValue='';document.getElementById('pin-msg').textContent=m==='change'?'Enter new PIN':'Enter PIN';document.getElementById('pin-error').textContent='';updateDots();document.getElementById('pin-screen').style.display='';document.getElementById('app-main').style.display='none'}

const STORE_KEY='ledger_renewal_v3',FILE_DB='ledger_files_v1',defaultState={businesses:[],employees:[],payments:[]};let state=load();
function load(){try{const r=localStorage.getItem(STORE_KEY);if(!r){const v=localStorage.getItem('ledger_renewal_v2')||localStorage.getItem('ledger_renewal_v1');if(v){const o=JSON.parse(v);return{businesses:o.businesses||[],employees:o.employees||[],payments:o.payments||[]}}return JSON.parse(JSON.stringify(defaultState))}return{...defaultState,...JSON.parse(r)}}catch(e){return JSON.parse(JSON.stringify(defaultState))}}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
let _db;function openFileDB(){if(_db)return Promise.resolve(_db);return new Promise((r,j)=>{const q=indexedDB.open(FILE_DB,1);q.onupgradeneeded=()=>q.result.createObjectStore('files');q.onsuccess=()=>{_db=q.result;r(_db)};q.onerror=()=>j(q.error)})}
function putFile(k,b){return openFileDB().then(d=>new Promise((r,j)=>{const t=d.transaction('files','readwrite');t.objectStore('files').put(b,k);t.oncomplete=()=>r();t.onerror=()=>j(t.error)}))}
function getFile(k){return openFileDB().then(d=>new Promise((r,j)=>{const t=d.transaction('files','readonly');const q=t.objectStore('files').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)}))}
function deleteFileFromDB(k){return openFileDB().then(d=>new Promise((r,j)=>{const t=d.transaction('files','readwrite');t.objectStore('files').delete(k);t.oncomplete=()=>r();t.onerror=()=>j(t.error)}))}

/* HELPERS */
function todayISO(){const d=new Date();d.setHours(0,0,0,0);return d.toISOString().slice(0,10)}
function parseDate(s){if(!s)return null;const d=new Date(s+'T00:00:00');return isNaN(d)?null:d}
function fmtDate(s){const d=parseDate(s);if(!d)return'—';return d.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'})}
function fmtDateLong(s){const d=parseDate(s);if(!d)return'—';return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}
function fmtDateAr(s){const d=parseDate(s);if(!d)return'—';return d.toLocaleDateString('ar-BH',{day:'numeric',month:'long',year:'numeric'})}
function fmtDateNum(s){const d=parseDate(s);if(!d)return'—';return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}
function daysUntil(s){const d=parseDate(s);if(!d)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/86400000)}
function addPeriod(iso,p){const d=parseDate(iso);if(!d)return iso;if(p==='monthly')d.setMonth(d.getMonth()+1);else if(p==='biannual')d.setMonth(d.getMonth()+6);else if(p==='yearly')d.setFullYear(d.getFullYear()+1);else if(p==='2years')d.setFullYear(d.getFullYear()+2);else if(p==='3years')d.setFullYear(d.getFullYear()+3);return d.toISOString().slice(0,10)}
function contractEndDate(start,dur){const d=parseDate(addPeriod(start,dur));if(!d)return start;d.setDate(d.getDate()-1);return d.toISOString().slice(0,10)}
function statusFor(d){if(d===null||d===undefined)return{key:'gray',label:'No date'};if(d<0)return{key:'red',label:'Overdue '+Math.abs(d)+'d'};if(d<=30)return{key:'red',label:d+'d left'};if(d<=60)return{key:'amber',label:d+'d left'};if(d<=90)return{key:'yellow',label:d+'d left'};return{key:'green',label:d+'d left'}}
function labelPeriod(p){return({monthly:'Monthly',biannual:'Every 6 months',yearly:'Yearly','2years':'Every 2 years','3years':'Every 3 years'})[p]||p||'—'}
function labelDuration(p){return({biannual:'6 months',yearly:'1 year','2years':'2 years','3years':'3 years'})[p]||''}
function labelDurationAr(p){return({biannual:'٦ أشهر',yearly:'سنة','2years':'سنتان','3years':'٣ سنوات'})[p]||''}
function fmtFileSize(b){if(!b)return'';if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(2)+' MB'}
function formatMoney(a){if(a==null||a==='')return'';return'BHD '+Number(a).toLocaleString(undefined,{minimumFractionDigits:3,maximumFractionDigits:3})}
function composeAddr(b){const p=[];if(b.addrBuilding)p.push('Building '+b.addrBuilding);if(b.addrRoad)p.push('Road '+b.addrRoad);if(b.addrBlock)p.push('Block '+b.addrBlock);if(b.addrCity)p.push(b.addrCity);if(b.addrCountry)p.push(b.addrCountry);return p.join(', ')||b.address||''}
function composeAddrAr(b){const p=[];if(b.addrBuilding)p.push('مبنى '+b.addrBuilding);if(b.addrRoad)p.push('طريق '+b.addrRoad);if(b.addrBlock)p.push('مجمع '+b.addrBlock);if(b.addrCityAr)p.push(b.addrCityAr);if(b.addrCountryAr)p.push(b.addrCountryAr);return p.join('، ')||b.addressAr||''}
function yearsBetween(s){const d=parseDate(s);if(!d)return'';const n=new Date();let y=n.getFullYear()-d.getFullYear(),m=n.getMonth()-d.getMonth();if(m<0){y--;m+=12}return y>0?(y+' year'+(y!==1?'s':'')+(m>0?' '+m+' month'+(m!==1?'s':''):'')):(m+' month'+(m!==1?'s':''))}
const POS_PRESETS=[{en:'Tailor',ar:'خياط'},{en:'Hairdresser',ar:'مصففة شعر'}];
const NAT_PRESETS=[{en:'Indian',ar:'هندي'},{en:'Filipino',ar:'فلبيني'},{en:'Bangladeshi',ar:'بنغلاديشي'},{en:'Pakistani',ar:'باكستاني'},{en:'Nepali',ar:'نيبالي'}];
function posArFromEn(v){const m=POS_PRESETS.find(p=>p.en.toLowerCase()===v.toLowerCase());return m?m.ar:''}
function natArFromEn(v){const m=NAT_PRESETS.find(p=>p.en.toLowerCase()===v.toLowerCase());return m?m.ar:''}

async function attachFile(rt,ri,fn,file){if(!file)return;const key=rt+'-'+ri+'-'+fn+'-'+uid();await putFile(key,file);const c=rt==='biz'?state.businesses:state.employees;const r=c.find(x=>x.id===ri);if(!r)return;if(r[fn]&&r[fn].key)try{await deleteFileFromDB(r[fn].key)}catch(e){}r[fn]={key,name:file.name,size:file.size,type:file.type,uploadedAt:todayISO()};save();refreshFileSection(rt,ri,fn);toast('Attached');render()}
async function viewAttachment(rt,ri,fn){const c=rt==='biz'?state.businesses:state.employees;const r=c.find(x=>x.id===ri);if(!r||!r[fn])return;const b=await getFile(r[fn].key);if(!b){toast('Not found');return}const u=URL.createObjectURL(b);const nm=r[fn].name||'file';const p=document.createElement('div');p.id='doc-preview';p.style.cssText='position:fixed;inset:0;z-index:100;background:#333;display:flex;flex-direction:column';const bar=document.createElement('div');bar.style.cssText='background:#1c1c1a;color:#f5f2ec;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;min-height:50px';bar.innerHTML=`<button style="background:#f5f2ec;color:#1c1c1a;border:0;padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer" onclick="closeDocPreview()">← Back</button><span style="font-size:13px;opacity:.7;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px">${escapeHTML(nm)}</span><a href="${u}" download="${escapeHTML(nm)}" style="background:#0d6d56;color:#fff;padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;text-decoration:none">Download</a>`;const ifr=document.createElement('iframe');ifr.src=u;ifr.style.cssText='flex:1;border:0;width:100%;background:#fff';p.appendChild(bar);p.appendChild(ifr);document.body.appendChild(p)}
async function downloadAttachment(rt,ri,fn){const c=rt==='biz'?state.businesses:state.employees;const r=c.find(x=>x.id===ri);if(!r||!r[fn])return;const b=await getFile(r[fn].key);if(!b){toast('Not found');return}const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=r[fn].name||'file';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(u),5000);toast('Downloading…')}
async function removeAttachment(rt,ri,fn){if(!confirm('Remove file?'))return;const c=rt==='biz'?state.businesses:state.employees;const r=c.find(x=>x.id===ri);if(!r||!r[fn])return;try{await deleteFileFromDB(r[fn].key)}catch(e){}delete r[fn];save();refreshFileSection(rt,ri,fn);toast('Removed');render()}
function renderFileSection(rt,ri,fn,rec){const f=rec[fn];if(f)return`<div class="file-card"><div class="file-icon">PDF</div><div class="file-info"><div class="file-name">${escapeHTML(f.name)}</div><div class="file-meta">${fmtFileSize(f.size)}</div></div><div class="file-actions"><button type="button" class="btn btn-sm" onclick="viewAttachment('${rt}','${ri}','${fn}')">Open</button><button type="button" class="btn btn-sm" onclick="downloadAttachment('${rt}','${ri}','${fn}')">Download</button><button type="button" class="btn btn-sm btn-danger btn-ghost" onclick="removeAttachment('${rt}','${ri}','${fn}')">✕</button></div></div>`;return`<label class="file-upload"><input type="file" accept="application/pdf,.pdf,image/*" onchange="attachFile('${rt}','${ri}','${fn}',this.files[0])" style="display:none"><div class="file-upload-content"><div class="file-upload-icon">＋</div><div><div style="font-weight:600;font-size:14px">Tap to upload</div><div style="font-size:12px;color:var(--muted);margin-top:2px">PDF or image</div></div></div></label>`}
function refreshFileSection(rt,ri,fn){const el=document.getElementById('file-section-'+ri+'-'+fn);if(!el)return;const c=rt==='biz'?state.businesses:state.employees;const r=c.find(x=>x.id===ri);if(r)el.innerHTML=renderFileSection(rt,ri,fn,r)}
let _pdfTitle='document',_oldTitle='Ledger';
function previewDocument(html,title){
  _pdfTitle=title||'document';
  _oldTitle=document.title;
  document.title=_pdfTitle;
  // Parse document HTML and inject directly into page (no iframe)
  const parser=new DOMParser();
  const doc=parser.parseFromString(html,'text/html');
  const preview=document.createElement('div');
  preview.id='doc-preview';
  preview.style.cssText='position:fixed;inset:0;z-index:100;background:#f0eee8;display:flex;flex-direction:column;overflow:auto';
  // Toolbar
  const bar=document.createElement('div');
  bar.id='doc-preview-bar';
  bar.style.cssText='background:#1c1c1a;color:#f5f2ec;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;min-height:50px';
  bar.innerHTML=`<button style="background:#f5f2ec;color:#1c1c1a;border:0;padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer" onclick="closeDocPreview()">← Back</button><button style="background:#0d6d56;color:#fff;border:0;padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer" onclick="window.print()">Save as PDF</button>`;
  preview.appendChild(bar);
  // Document content
  const content=document.createElement('div');
  content.id='doc-print-area';
  // Copy styles from generated document
  doc.querySelectorAll('style').forEach(s=>{const ns=document.createElement('style');ns.textContent=s.textContent;content.appendChild(ns)});
  // Copy page content
  const page=doc.querySelector('.page');
  if(page){content.appendChild(document.adoptNode(page))}
  preview.appendChild(content);
  document.body.appendChild(preview);
}
function closeDocPreview(){
  const el=document.getElementById('doc-preview');if(el)el.remove();
  document.title=_oldTitle;
}
function printDocPreview(){window.print()}

if(e.visaExpiry)items.push({id:'visa-'+e.id,kind:'Visa Expiry',title:e.name,sub,date:e.visaExpiry,renew:()=>renewEmployeeField(e.id,'visaExpiry',e.visaFrequency||'2years'),view:()=>{switchView('employees');setTimeout(()=>openEmployeeForm(e),50)}});

/* CRUD */
function saveBusiness(b){if(b.id){const i=state.businesses.findIndex(x=>x.id===b.id);state.businesses[i]={...state.businesses[i],...b}}else{b.id=uid();state.businesses.push(b)}save();render()}
async function deleteBusiness(id){const b=state.businesses.find(x=>x.id===id);if(b){for(const k of Object.keys(b)){if((k==='crFile'||k.startsWith('bizdoc_'))&&b[k]&&b[k].key)try{await deleteFileFromDB(b[k].key)}catch(e){}}}state.businesses=state.businesses.filter(x=>x.id!==id);save();render();toast('Deleted')}
function renewBusiness(id){const b=state.businesses.find(x=>x.id===id);if(!b)return;b.history=b.history||[];b.history.push({date:todayISO(),from:b.crExpiry,action:'CR renewed'});b.crExpiry=addPeriod(b.crExpiry||todayISO(),b.crFrequency||'yearly');save();render();toast('Renewed → '+fmtDate(b.crExpiry))}
function saveEmployee(e){if(e.id){const i=state.employees.findIndex(x=>x.id===e.id);state.employees[i]={...state.employees[i],...e}}else{e.id=uid();state.employees.push(e)}save();render()}
async function deleteEmployee(id){const e=state.employees.find(x=>x.id===id);if(e)for(const fn of['permitFile','residencyFile','signedContractFile']){if(e[fn]&&e[fn].key)try{await deleteFileFromDB(e[fn].key)}catch(err){}}state.employees=state.employees.filter(x=>x.id!==id);save();render();toast('Removed')}
function renewEmployeeField(id,field,period){const e=state.employees.find(x=>x.id===id);if(!e)return;e.history=e.history||[];e.history.push({date:todayISO(),from:e[field],action:'Renewed '+field});e[field]=addPeriod(e[field]||todayISO(),period);save();render();toast('Renewed → '+fmtDate(e[field]))}
function savePayment(p){if(p.id){const i=state.payments.findIndex(x=>x.id===p.id);state.payments[i]={...state.payments[i],...p}}else{p.id=uid();state.payments.push(p)}save();render()}
function deletePayment(id){state.payments=state.payments.filter(x=>x.id!==id);save();render();toast('Deleted')}
function markPaid(id){const p=state.payments.find(x=>x.id===id);if(!p)return;p.history=p.history||[];p.history.push({date:todayISO(),from:p.nextDue,action:'Paid'});p.nextDue=addPeriod(p.nextDue||todayISO(),p.frequency||'monthly');save();render();toast('Paid → next '+fmtDate(p.nextDue))}

function renderDashboard(){const items=allItems();const overdue=items.filter(i=>i.days!==null&&i.days<0);const next30=items.filter(i=>i.days!==null&&i.days>=0&&i.days<=30);const totalM=state.payments.filter(p=>p.frequency==='monthly').reduce((s,p)=>s+(Number(p.amount)||0),0);const urgent=[...overdue,...next30].slice(0,15);
return`<div class="page-head"><div><div class="page-title">Dashboard</div><div class="page-sub">What needs your attention, sorted by urgency.</div></div><div class="page-actions"><button class="btn btn-accent" onclick="openReport()">Export Report</button></div></div>

<div class="split"><div class="card"><div class="card-head"><div class="card-title">Upcoming & overdue</div></div>${urgent.length?`<div class="urgent-list">${urgent.map(i=>{const s=statusFor(i.days);return`<div class="urgent-item"><div class="urgent-icon ${s.key}">${i.kind[0]}</div><div class="urgent-text"><div class="urgent-title">${escapeHTML(i.title)}</div><div class="urgent-sub">${escapeHTML(i.kind)} · ${escapeHTML(i.sub||'')}</div></div><div class="urgent-date"><div style="font-weight:600;color:var(--ink)">${fmtDate(i.date)}</div><span class="pill ${s.key}" style="margin-top:4px">${s.label}</span></div><div class="t-actions" style="margin-left:8px"><button class="btn btn-sm" data-renew="${i.id}">Renew</button></div></div>`}).join('')}</div>`:`<div class="empty"><div class="empty-title">All clear</div></div>`}</div>
<div class="card"><div class="card-head"><div class="card-title">Quick add</div></div><div class="card-pad" style="display:flex;flex-direction:column;gap:10px"><button class="btn btn-accent" onclick="openBusinessForm()">＋ Business</button><button class="btn" onclick="openEmployeeForm()">＋ Employee</button><button class="btn" onclick="openPaymentForm()">＋ Payment</button></div></div></div>`}

/* BUSINESSES */
function renderBusinesses(){const search=filters.search.toLowerCase();const rows=state.businesses.filter(b=>!search||b.name.toLowerCase().includes(search)).sort((a,b)=>(daysUntil(a.crExpiry)??1e9)-(daysUntil(b.crExpiry)??1e9));
return`<div class="page-head"><div><div class="page-title">Businesses</div></div><div class="page-actions"><div class="search-box"><input type="text" placeholder="Search…" value="${escapeHTML(filters.search)}" data-search></div><button class="btn btn-accent" onclick="openBusinessForm()">＋ Add</button></div></div>
<div class="card">${rows.length?`<div class="table-wrap"><table><thead><tr><th>Business</th><th>CR #</th><th>Expiry</th><th>Status</th><th>Doc</th><th></th></tr></thead><tbody>${rows.map(b=>{const s=statusFor(daysUntil(b.crExpiry));return`<tr><td><div class="t-name">${escapeHTML(b.name)}</div><div class="t-sub">${state.employees.filter(e=>e.businessId===b.id).length} employees</div></td><td class="t-mono">${escapeHTML(b.crNumber||'—')}</td><td>${fmtDate(b.crExpiry)}</td><td><span class="pill ${s.key}">${s.label}</span></td><td>${b.crFile?`<a class="t-attach" onclick="viewAttachment('biz','${b.id}','crFile')">📄</a>`:'—'}</td><td><div class="t-actions"><button class="btn btn-sm" data-renew-biz="${b.id}">Renew</button><button class="btn btn-sm btn-ghost" data-edit-biz="${b.id}">Edit</button></div></td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><div class="empty-title">No businesses yet</div><button class="btn btn-accent" onclick="openBusinessForm()">＋ Add</button></div>`}</div>`}
function openBusinessForm(b){const isEdit=!!b;b=b||{name:'',nameAr:'',crNumber:'',crIssue:'',crExpiry:'',crFrequency:'yearly',ownerName:'',ownerNameAr:'',addrBuilding:'',addrRoad:'',addrBlock:'',addrCity:'',addrCityAr:'',addrCountry:'Kingdom of Bahrain',addrCountryAr:'مملكة البحرين',notes:''};
openModal({title:isEdit?'Edit business':'New business',wide:true,body:`
<div class="form-grid"><div class="form-row"><label class="form-label">Name (EN)</label><input type="text" id="f-name" value="${escapeHTML(b.name||'')}" required></div><div class="form-row"><label class="form-label">Name (AR)</label><input type="text" id="f-namear" dir="rtl" value="${escapeHTML(b.nameAr||'')}"></div></div>
<div class="form-grid"><div class="form-row"><label class="form-label">Owner (EN)</label><input type="text" id="f-owner" value="${escapeHTML(b.ownerName||'')}"></div><div class="form-row"><label class="form-label">Owner (AR)</label><input type="text" id="f-ownerar" dir="rtl" value="${escapeHTML(b.ownerNameAr||'')}"></div></div>
<div class="form-grid"><div class="form-row"><label class="form-label">CR Number</label><input type="text" id="f-cr" value="${escapeHTML(b.crNumber||'')}"></div><div class="form-row"><label class="form-label">Issue date</label><input type="date" id="f-issue" value="${b.crIssue||''}"></div><div class="form-row"><label class="form-label">Expiry</label><input type="date" id="f-expiry" value="${b.crExpiry||''}"></div><div class="form-row"><label class="form-label">Frequency</label><select id="f-freq">${['yearly','2years','3years'].map(p=>`<option value="${p}"${b.crFrequency===p?' selected':''}>${labelPeriod(p)}</option>`).join('')}</select></div></div>
<div class="form-section">Address</div>
<div class="form-grid"><div class="form-row"><label class="form-label">Building / مبنى</label><input type="text" id="f-bldg" value="${escapeHTML(b.addrBuilding||'')}"></div><div class="form-row"><label class="form-label">Road / طريق</label><input type="text" id="f-road" value="${escapeHTML(b.addrRoad||'')}"></div><div class="form-row"><label class="form-label">Block / مجمع</label><input type="text" id="f-block" value="${escapeHTML(b.addrBlock||'')}"></div></div>
<div class="form-grid"><div class="form-row"><label class="form-label">City (EN)</label><input type="text" id="f-city" value="${escapeHTML(b.addrCity||'')}"></div><div class="form-row"><label class="form-label">City (AR)</label><input type="text" id="f-cityar" dir="rtl" value="${escapeHTML(b.addrCityAr||'')}"></div></div>
<div class="form-grid"><div class="form-row"><label class="form-label">Country (EN)</label><input type="text" id="f-country" value="${escapeHTML(b.addrCountry||'Kingdom of Bahrain')}"></div><div class="form-row"><label class="form-label">Country (AR)</label><input type="text" id="f-countryar" dir="rtl" value="${escapeHTML(b.addrCountryAr||'مملكة البحرين')}"></div></div>
<div class="form-row"><label class="form-label">Notes</label><textarea id="f-notes">${escapeHTML(b.notes||'')}</textarea></div>
${isEdit?`<div class="form-section">📁 Business Documents</div>
<div class="doc-card" style="margin-bottom:10px"><div class="doc-card-title">📄 Commercial Registration (CR)</div><div id="file-section-${b.id}-crFile">${renderFileSection('biz',b.id,'crFile',b)}</div></div>
<div id="biz-docs-${b.id}">${renderBizDocs(b)}</div>
<div style="margin-top:10px"><button type="button" class="btn btn-sm" onclick="addBizDoc('${b.id}')">＋ Add document</button></div>`:''}`,
actions:[isEdit?{label:'Delete',cls:'btn-danger btn-ghost',handler:()=>{closeModal();confirmDialog('Delete?','',()=>deleteBusiness(b.id))}}:null,{label:'Cancel',cls:'btn-ghost',handler:closeModal},{label:isEdit?'Save':'Add',cls:'btn-accent',handler:()=>{const d={id:b.id,name:val('f-name'),nameAr:val('f-namear'),ownerName:val('f-owner'),ownerNameAr:val('f-ownerar'),crNumber:val('f-cr'),crIssue:val('f-issue'),crExpiry:val('f-expiry'),crFrequency:val('f-freq'),addrBuilding:val('f-bldg'),addrRoad:val('f-road'),addrBlock:val('f-block'),addrCity:val('f-city'),addrCityAr:val('f-cityar'),addrCountry:val('f-country'),addrCountryAr:val('f-countryar'),notes:val('f-notes')};if(!d.name)return toast('Name required');saveBusiness(d);closeModal();toast(isEdit?'Saved':'Added')}}].filter(Boolean)})}

/* BUSINESS DOCUMENT VAULT */
const BIZ_DOC_TYPES=['Municipality Licence','MOIC Licence','Civil Defence Certificate','Lease Agreement','GOSI Registration','VAT Certificate','Trade Name Certificate','Other'];
function renderBizDocs(b){const docs=b.documents||[];if(!docs.length)return'<div class="file-hint">No additional documents. Add municipality licence, lease, GOSI, VAT, etc.</div>';
return docs.map(d=>{const s=d.expiry?statusFor(daysUntil(d.expiry)):null;return`<div class="doc-card" style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap"><div style="flex:1;min-width:0"><div class="doc-card-title">📋 ${escapeHTML(d.name)}</div>${d.expiry?`<div style="font-size:12px;color:var(--muted);margin-top:2px">Expires ${fmtDate(d.expiry)} <span class="pill ${s.key}" style="margin-left:4px">${s.label}</span></div>`:''}</div><div style="display:flex;gap:4px"><button type="button" class="btn btn-sm btn-ghost" onclick="editBizDoc('${b.id}','${d.id}')">Edit</button><button type="button" class="btn btn-sm btn-danger btn-ghost" onclick="deleteBizDoc('${b.id}','${d.id}')">✕</button></div></div><div id="file-section-${b.id}-bizdoc_${d.id}" style="margin-top:8px">${renderFileSection('biz',b.id,'bizdoc_'+d.id,b)}</div></div>`}).join('')}
function addBizDoc(bid){editBizDoc(bid,null)}
function editBizDoc(bid,did){const b=state.businesses.find(x=>x.id===bid);if(!b)return;const existing=did?(b.documents||[]).find(d=>d.id===did):null;const d=existing||{name:'',expiry:'',renewFreq:'yearly'};
closeModal();setTimeout(()=>{openModal({title:existing?'Edit document':'Add business document',body:`
<div class="form-row"><label class="form-label">Document type</label><input type="text" id="bd-name" list="dl-bizdoc" value="${escapeHTML(d.name)}" placeholder="Choose or type"><datalist id="dl-bizdoc">${BIZ_DOC_TYPES.map(t=>`<option value="${t}">`).join('')}</datalist></div>
<div class="form-grid"><div class="form-row"><label class="form-label">Expiry date (optional)</label><input type="date" id="bd-exp" value="${d.expiry||''}"></div><div class="form-row"><label class="form-label">Renewal frequency</label><select id="bd-freq">${['yearly','2years','3years'].map(p=>`<option value="${p}"${d.renewFreq===p?' selected':''}>${labelPeriod(p)}</option>`).join('')}</select></div></div>
<div class="form-hint">After saving, re-open the business to upload the PDF.</div>`,
actions:[{label:'Cancel',cls:'btn-ghost',handler:()=>{closeModal();setTimeout(()=>openBusinessForm(b),50)}},{label:'Save',cls:'btn-accent',handler:()=>{const name=val('bd-name');if(!name)return toast('Name required');b.documents=b.documents||[];if(existing){existing.name=name;existing.expiry=val('bd-exp');existing.renewFreq=val('bd-freq')}else{b.documents.push({id:uid(),name,expiry:val('bd-exp'),renewFreq:val('bd-freq')})}save();closeModal();setTimeout(()=>openBusinessForm(b),50);toast('Saved')}}]})},50)}
async function deleteBizDoc(bid,did){if(!confirm('Delete this document?'))return;const b=state.businesses.find(x=>x.id===bid);if(!b)return;const fk='bizdoc_'+did;if(b[fk]&&b[fk].key)try{await deleteFileFromDB(b[fk].key)}catch(e){}delete b[fk];b.documents=(b.documents||[]).filter(d=>d.id!==did);save();closeModal();setTimeout(()=>openBusinessForm(b),50);toast('Deleted')}
function renewBizDoc(bid,did){const b=state.businesses.find(x=>x.id===bid);if(!b)return;const d=(b.documents||[]).find(x=>x.id===did);if(!d||!d.expiry)return;d.expiry=addPeriod(d.expiry,d.renewFreq||'yearly');save();render();toast('Renewed → '+fmtDate(d.expiry))}

/* EMPLOYEES */
function renderEmployees(){const search=filters.search.toLowerCase();const rows=state.employees.filter(e=>filters.biz==='all'||e.businessId===filters.biz).filter(e=>!search||e.name.toLowerCase().includes(search)||(e.cprNumber||'').toLowerCase().includes(search)||(e.passportNumber||'').toLowerCase().includes(search)).sort((a,b)=>{const da=Math.min(daysUntil(a.cprExpiry)??1e9,daysUntil(a.visaExpiry)??1e9,daysUntil(a.medicalNext)??1e9,daysUntil(a.passportExpiry)??1e9);const db=Math.min(daysUntil(b.cprExpiry)??1e9,daysUntil(b.visaExpiry)??1e9,daysUntil(b.medicalNext)??1e9,daysUntil(b.passportExpiry)??1e9);return da-db});
const bizChips=`<button class="chip ${filters.biz==='all'?'active':''}" data-biz-filter="all">All</button>`+state.businesses.map(b=>`<button class="chip ${filters.biz===b.id?'active':''}" data-biz-filter="${b.id}">${escapeHTML(b.name)}</button>`).join('');
function cell(d){if(!d)return'<span style="color:var(--muted)">—</span>';const s=statusFor(daysUntil(d));return`<div>${fmtDate(d)}</div><span class="pill ${s.key}">${s.label}</span>`}
function mcell(label,d){if(!d)return`<div class="ec-item"><div class="ec-label">${label}</div><div class="ec-val" style="color:var(--muted)">—</div></div>`;const s=statusFor(daysUntil(d));return`<div class="ec-item ${s.key}"><div class="ec-label">${label}</div><div class="ec-val">${fmtDate(d)}</div><div class="ec-days">${s.label}</div></div>`}
function urgency(e){const m=Math.min(daysUntil(e.cprExpiry)??1e9,daysUntil(e.visaExpiry)??1e9,daysUntil(e.medicalNext)??1e9,daysUntil(e.passportExpiry)??1e9);if(m===1e9)return'';if(m<0)return'ec-overdue';if(m<=30)return'ec-urgent';if(m<=60)return'ec-soon';return''}
const cards=rows.map(e=>{const biz=state.businesses.find(b=>b.id===e.businessId);const u=urgency(e);const nDocs=(e.contracts||[]).length+(e.documents||[]).length;return`<div class="ec ${u}" data-edit-emp="${e.id}"><div class="ec-head"><div class="ec-avatar">${escapeHTML((e.name||'?').trim()[0].toUpperCase())}</div><div class="ec-info"><div class="ec-name">${escapeHTML(e.name)}</div><div class="ec-meta">${escapeHTML(e.position||'—')}${biz?' · '+escapeHTML(biz.name):''}</div></div><div class="ec-arrow">›</div></div><div class="ec-grid">${mcell('CPR',e.cprExpiry)}${mcell('Passport',e.passportExpiry)}${mcell('Visa',e.visaExpiry)}${mcell('Medical',e.medicalNext)}</div>${nDocs?`<div class="ec-foot">📂 ${nDocs} document${nDocs!==1?'s':''}${e.dateOfJoining?' · Joined '+fmtDate(e.dateOfJoining):''}</div>`:e.dateOfJoining?`<div class="ec-foot">Joined ${fmtDate(e.dateOfJoining)}</div>`:''}</div>`}).join('');
return`<div class="page-head"><div><div class="page-title">Employees</div><div class="page-sub">${rows.length} employee${rows.length!==1?'s':''}</div></div><div class="page-actions"><div class="search-box"><input type="text" placeholder="Search name, CPR, passport…" value="${escapeHTML(filters.search)}" data-search></div><button class="btn btn-accent" onclick="openEmployeeForm()"${state.businesses.length?'':' disabled'}>＋ Add</button></div></div>
${state.businesses.length>1?`<div class="toolbar"><div class="chips">${bizChips}</div></div>`:''}
${rows.length?`<div class="ec-list">${cards}</div>`:`<div class="ec-list"><div class="card"><div class="empty"><div class="empty-title">${state.businesses.length===0?'Add a business first':'No employees yet'}</div>${state.businesses.length?'<button class="btn btn-accent" onclick="openEmployeeForm()">＋ Add employee</button>':''}</div></div></div>`}
<div class="card emp-table">${rows.length?`<div class="table-wrap"><table><thead><tr><th>Employee</th><th>Business</th><th>CPR Expiry</th><th>Passport Expiry</th><th>Visa</th><th>Medical</th><th></th></tr></thead><tbody>${rows.map(e=>{const biz=state.businesses.find(b=>b.id===e.businessId);return`<tr><td><div class="t-name">${escapeHTML(e.name)}</div><div class="t-sub">${escapeHTML(e.position||'')}${e.dateOfJoining?' · Since '+fmtDate(e.dateOfJoining):''}</div></td><td>${biz?escapeHTML(biz.name):'—'}</td><td>${cell(e.cprExpiry)}</td><td>${cell(e.passportExpiry)}</td><td>${cell(e.visaExpiry)}</td><td>${cell(e.medicalNext)}</td><td><div class="t-actions"><button class="btn btn-sm" data-edit-emp="${e.id}">Open</button></div></td></tr>`}).join('')}</tbody></table></div>`:state.businesses.length===0?`<div class="empty"><div class="empty-title">Add a business first</div></div>`:`<div class="empty"><div class="empty-title">No employees yet</div><button class="btn btn-accent" onclick="openEmployeeForm()">＋ Add</button></div>`}</div>`}

openModal({title:isEdit?'Edit employee':'New employee',wide:true,body:`

<div class="form-grid"><div class="form-row"><label class="form-label">Date of joining</label><input type="date" id="f-doj" value="${e.dateOfJoining||''}"></div><div class="form-row"><label class="form-label">Basic salary (BHD)</label><input type="number" id="f-sal" step="0.001" value="${e.basicSalary||''}"></div></div>

<div class="form-grid"><div class="form-row"><label class="form-label">CPR number</label><input type="text" id="f-cpr" value="${escapeHTML(e.cprNumber||'')}"></div><div class="form-row"><label class="form-label">CPR expiry</label><input type="date" id="f-cprexp" value="${e.cprExpiry||''}"></div><div class="form-row"><label class="form-label">Passport number</label><input type="text" id="f-pp" value="${escapeHTML(e.passportNumber||'')}"></div><div class="form-row"><label class="form-label">Passport expiry</label><input type="date" id="f-ppexp" value="${e.passportExpiry||''}"></div></div>
<div class="form-section">Visa</div>
<div class="form-grid"><div class="form-row"><label class="form-label">Visa number</label><input type="text" id="f-visa" value="${escapeHTML(e.visaNumber||'')}"></div><div class="form-row"><label class="form-label">Visa expiry</label><input type="date" id="f-visaexp" value="${e.visaExpiry||''}"></div><div class="form-row"><label class="form-label">Frequency</label><select id="f-visafreq">${['biannual','yearly','2years','3years'].map(p=>`<option value="${p}"${e.visaFrequency===p?' selected':''}>${labelPeriod(p)}</option>`).join('')}</select></div></div>
<div class="form-section">Medical</div>

<div class="form-row"><label class="form-label">Notes</label><textarea id="f-notes">${escapeHTML(e.notes||'')}</textarea></div>
${isEdit?`
<div class="form-section">📁 Uploaded Documents</div>
<div class="doc-grid">
<div class="doc-card"><div class="doc-card-title">📄 Residency Permit</div><div id="file-section-${e.id}-residencyFile">${renderFileSection('emp',e.id,'residencyFile',e)}</div></div>

</div>

<div class="doc-card"><div class="doc-card-title">💰 Salary Certificate</div><div class="doc-card-actions"><button type="button" class="btn btn-sm btn-accent" onclick="generateSalaryCert('${e.id}')">Generate</button></div></div>
<div class="doc-card"><div class="doc-card-title">✅ No Objection Certificate</div><div class="doc-card-actions"><button type="button" class="btn btn-sm btn-accent" onclick="closeModal();setTimeout(()=>openNOCForm('${e.id}'),50)">Generate</button></div></div>

function generateContingencyPlan(eid){const e=state.employees.find(x=>x.id===eid);if(!e)return;const biz=state.businesses.find(b=>b.id===e.businessId);if(!biz){toast('Business not found');return}

const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Contingency Plan</title><style>@page{size:A4;margin:0}*{box-sizing:border-box}body{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11pt;line-height:1.7;color:#1a1a1a;margin:0;padding:20px;background:#eee}.page{background:#fff;max-width:210mm;margin:0 auto;padding:20mm;box-shadow:0 2px 20px rgba(0,0,0,.1)}.hd{text-align:center;margin-bottom:30px}.hd .dt{font-size:10pt;color:#555}.hd h2{font-size:14pt;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.05em}.hd .bz{font-size:12pt;font-weight:700}p{margin:14px 0;text-align:justify}.sg{margin-top:50px}.sg-n{font-weight:700;margin-top:30px}.sg-r{color:#555;font-size:10pt}@media print{body{background:#fff;padding:0}.page{box-shadow:none;padding:20mm;max-width:none;margin:0}}</style></head><body><div class="page"><div class="hd"><div class="dt">${fmtDateLong(todayISO())}</div><div class="bz">${escapeHTML(biz.name)}</div><h2>Contingency Plan</h2></div><p>I, <strong>${escapeHTML(owner)}</strong>, Owner, wish to convey this contingency plan related to the employment of <strong>${escapeHTML(e.name)}</strong>, a ${escapeHTML(e.nationality||'')} worker currently employed on the renewable period of ${endDate} contract under ${escapeHTML(biz.name)}. This plan covers remedial measures in the event of any contingency (natural calamity, man-made disaster, or war).</p><p>In the course of any impending contingency, we shall strive to repatriate the employee to their point of origin at the soonest possible time via a safe course of travel.</p><p>If repatriation is not possible, I shall provide continuous support (food, medicines, clothing, safe shelter) and constant communication with updates on their condition to their family.</p><p>Our company shall provide personal accident insurance with a reputable insurance company in the Kingdom of Bahrain covering benefits for their beneficiaries during employment.</p><p>AND BY VIRTUE OF THIS LETTER, our company pledges reasonable treatment for the employee's well-being in accordance with the job contract.</p><div class="sg"><div class="sg-n">${escapeHTML(owner)}</div><div class="sg-r">(Employer)</div></div></div></body></html>`;

function renderSettings(){return`<div class="page-head"><div><div class="page-title">Settings</div></div></div>
<div class="card" style="max-width:760px"><div class="card-head"><div class="card-title">Backup & Restore</div></div>

function allFileKeys(){const keys=[];state.businesses.forEach(b=>{for(const k of Object.keys(b)){if((k==='crFile'||k.startsWith('bizdoc_'))&&b[k]&&b[k].key)keys.push(b[k].key)}});state.employees.forEach(e=>{for(const fn of['permitFile','residencyFile','signedContractFile'])if(e[fn]&&e[fn].key)keys.push(e[fn].key)});return keys}
async function resetAll(){for(const k of allFileKeys())try{await deleteFileFromDB(k)}catch(e){}state=JSON.parse(JSON.stringify(defaultState));save();render();toast('Reset complete')}
async function exportData(){toast('Preparing…');const out={businesses:state.businesses,employees:state.employees,payments:state.payments,files:{}};for(const k of allFileKeys())try{const b=await getFile(k);if(b)out.files[k]={data:await blobToBase64(b),type:b.type}}catch(e){}const blob=new Blob([JSON.stringify(out)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='ledger-backup-'+todayISO()+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);toast('Downloaded')}
function blobToBase64(b){return new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.onerror=()=>j(f.error);f.readAsDataURL(b)})}
function buildJarvisCSV(){const today=todayISO();const clean=s=>String(s||'').replace(/\s+/g,' ').trim();const bizName=id=>{const b=state.businesses.find(x=>x.id===id);return b?clean(b.name):'';};const statusKey=d=>d===null?'missing':d<0?'overdue':d<=30?'due soon':'ok';const body=[];function add(business,category,name,due,amount){const d=due?daysUntil(due):null;body.push([business,category,clean(name),due||'',amount==null||amount===''?'':amount,statusKey(d),d==null?'':d,today]);}
state.businesses.forEach(b=>add(clean(b.name),'CR',b.name,b.crExpiry,''));
state.employees.forEach(e=>{const bn=bizName(e.businessId);add(bn,'CPR',e.name,e.cprExpiry,'');add(bn,'passport',e.name,e.passportExpiry,'');add(bn,'visa',e.name,e.visaExpiry,'');add(bn,'medical',e.name,e.medicalNext,'');const cs=(e.contracts||[]).filter(c=>c.endDate);if(cs.length){const latest=cs.reduce((a,c)=>c.endDate>a.endDate?c:a);add(bn,'contract',e.name,latest.endDate,'');}});
state.payments.forEach(p=>add(bizName(p.businessId),'payment',p.name,p.nextDue,p.amount));
body.sort((a,b)=>{const x=a[6]===''?1e9:+a[6],y=b[6]===''?1e9:+b[6];return x-y;});
const head=['business','category','name','due_or_expiry_date','amount_bhd','status','days_left','exported_on'];
const csv=[head].concat(body).map(r=>r.map(c=>{c=String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',')).join('\n');return{csv,rows:body.length}}
function exportForJarvis(){const{csv,rows}=buildJarvisCSV();const blob=new Blob([csv],{type:'text/csv'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='tracker-export.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);toast('Exported for Jarvis — '+rows+' rows')}
async function copyForJarvis(){const{csv,rows}=buildJarvisCSV();const done=()=>toast('Copied for G — '+rows+' rows. Paste it in the chat.');try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(csv);done();return}}catch(e){}try{const ta=document.createElement('textarea');ta.value=csv;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,csv.length);const ok=document.execCommand('copy');document.body.removeChild(ta);if(ok){done();return}}catch(e){}toast('Copy blocked — use Export CSV instead')}
function base64ToBlob(b,t){const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:t||'application/pdf'})}
async function importData(file){if(!file)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.businesses)throw 0;if(!confirm('Replace all data?'))return;await resetAll();state.businesses=d.businesses;state.employees=d.employees;state.payments=d.payments;if(d.files)for(const k of Object.keys(d.files))await putFile(k,base64ToBlob(d.files[k].data,d.files[k].type));save();render();toast('Restored')}catch(e){toast('Invalid file')}};r.readAsText(file)}

/* UTILS */
function openModal({title,body,actions,wide}){const ov=document.getElementById('overlay');ov.innerHTML=`<div class="modal" style="${wide?'max-width:720px':''}"><div class="modal-head"><div class="modal-title">${escapeHTML(title)}</div><button class="btn" style="padding:6px 10px;font-size:18px;min-height:36px" onclick="closeModal()">✕</button></div><div class="modal-body">${body}</div><div class="modal-foot" id="modal-foot"></div></div>`;const foot=ov.querySelector('#modal-foot');actions.forEach(a=>{const b=document.createElement('button');b.className='btn '+(a.cls||'');b.textContent=a.label;b.onclick=a.handler;foot.appendChild(b)});ov.classList.add('open');setTimeout(()=>{const i=ov.querySelector('input:not([type=file]):not([type=checkbox]),select,textarea');if(i)i.focus()},80)}
function closeModal(){document.getElementById('overlay').classList.remove('open')}
function confirmDialog(t,m,fn){openModal({title:t,body:`<div style="width:48px;height:48px;border-radius:50%;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px">!</div><div style="font-size:14px;color:var(--ink-2)">${escapeHTML(m)}</div>`,actions:[{label:'Cancel',cls:'btn-ghost',handler:closeModal},{label:'Confirm',cls:'btn-danger',handler:()=>{closeModal();fn()}}]})}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400)}
function bindViewEvents(){
document.querySelectorAll('[data-search]').forEach(el=>{el.addEventListener('input',e=>{filters.search=e.target.value;render();setTimeout(()=>{const i=document.querySelector('[data-search]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},10)})});
document.querySelectorAll('[data-biz-filter]').forEach(el=>el.addEventListener('click',()=>{filters.biz=el.dataset.bizFilter;render()}));
document.querySelectorAll('[data-renew-biz]').forEach(el=>el.addEventListener('click',()=>renewBusiness(el.dataset.renewBiz)));
document.querySelectorAll('[data-edit-biz]').forEach(el=>el.addEventListener('click',()=>{openBusinessForm(state.businesses.find(x=>x.id===el.dataset.editBiz))}));
document.querySelectorAll('[data-edit-emp]').forEach(el=>el.addEventListener('click',()=>{openEmployeeForm(state.employees.find(x=>x.id===el.dataset.editEmp))}));
document.querySelectorAll('[data-edit-pay]').forEach(el=>el.addEventListener('click',()=>{openPaymentForm(state.payments.find(x=>x.id===el.dataset.editPay))}));
document.querySelectorAll('[data-paid]').forEach(el=>el.addEventListener('click',()=>markPaid(el.dataset.paid)));
document.querySelectorAll('[data-renew]').forEach(el=>el.addEventListener('click',()=>{const i=allItems().find(x=>x.id===el.dataset.renew);if(i)i.renew()}))}
document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>switchView(n.dataset.view)));
document.getElementById('overlay').addEventListener('click',e=>{});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function val(id){const el=document.getElementById(id);return el?el.value.trim():''}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}
switchView('dashboard');
</script>
