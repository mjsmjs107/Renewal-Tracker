<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Ledger — Business Renewal Tracker</title>
<style>
:root{
  --bg:#f5f2ec;--bg-2:#efebe2;--surface:#ffffff;--surface-2:#faf8f3;
  --ink:#1c1c1a;--ink-2:#3d3d39;--muted:#7a766e;
  --line:#e3ddd0;--line-2:#cfc8b7;
  --accent:#0d6d56;--accent-ink:#074231;--accent-soft:#e3efe9;
  --red:#b3261e;--red-soft:#fbe9e7;
  --amber:#a86b00;--amber-soft:#fbeed1;
  --yellow:#8a7414;--yellow-soft:#f7f0d3;
  --green:#3a6b3a;--green-soft:#e6efe2;
  --shadow:0 1px 0 rgba(0,0,0,0.04),0 8px 28px -16px rgba(0,0,0,0.08);
  --shadow-lg:0 4px 16px -4px rgba(0,0,0,0.06),0 20px 50px -20px rgba(0,0,0,0.18);
  --serif:'Iowan Old Style','Charter','Source Serif Pro','Georgia',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','SF Pro Text','Helvetica Neue',system-ui,sans-serif;
  --mono:'SF Mono','Menlo','Consolas',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}

/* Layout */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{background:var(--bg-2);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{font-family:var(--serif);font-size:24px;letter-spacing:-0.02em;margin-bottom:4px;padding:4px 12px}
.brand .dot{color:var(--accent)}
.brand-sub{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);padding:0 12px;margin-bottom:28px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-section{font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);padding:16px 12px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;color:var(--ink-2);font-size:14.5px;font-weight:500;transition:background .15s;text-align:left;width:100%;min-height:44px}
.nav-item:hover{background:rgba(0,0,0,0.04)}
.nav-item.active{background:var(--ink);color:var(--bg)}
.nav-item .badge{margin-left:auto;font-size:11px;background:var(--red);color:#fff;padding:1px 7px;border-radius:999px;font-weight:600}
.nav-item.active .badge{background:#fff;color:var(--ink)}
.sidebar-footer{margin-top:auto;padding:12px;font-size:11px;color:var(--muted);line-height:1.5}

.content{padding:28px 32px 80px;max-width:1400px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;gap:20px;flex-wrap:wrap}
.page-title{font-family:var(--serif);font-size:34px;letter-spacing:-0.02em;line-height:1.1}
.page-sub{color:var(--muted);font-size:13.5px;margin-top:4px;max-width:520px}
.page-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Buttons — large touch targets */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:500;border:1px solid var(--line-2);background:var(--surface);transition:transform .08s,background .15s,border-color .15s;white-space:nowrap;min-height:44px}
.btn:hover{background:var(--surface-2);border-color:var(--ink-2)}
.btn:active{transform:scale(0.97)}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-accent:hover{background:var(--accent-ink)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:rgba(0,0,0,0.05)}
.btn-danger{color:var(--red);border-color:var(--line-2)}
.btn-danger:hover{background:var(--red-soft);border-color:var(--red)}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:8px;min-height:36px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card-pad{padding:20px 22px}
.card-head{padding:16px 22px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-title{font-family:var(--serif);font-size:18px}

/* Dashboard stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.stat-label{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat-value{font-family:var(--serif);font-size:34px;letter-spacing:-0.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.stat-meta{font-size:12px;color:var(--muted);margin-top:4px}
.stat.alert .stat-value{color:var(--red)}
.stat.warn .stat-value{color:var(--amber)}

/* Tables */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surface-2)}
.t-name{font-weight:600;color:var(--ink)}
.t-sub{font-size:12px;color:var(--muted);margin-top:2px}
.t-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.t-mono{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.t-attach{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:500;font-size:12.5px;cursor:pointer;padding:4px 0;min-height:32px}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.yellow{background:var(--yellow-soft);color:var(--yellow)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.gray{background:#ececec;color:#666}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(28,28,26,0.4);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.overlay.open{display:flex}
.modal{background:var(--bg);border-radius:18px;width:100%;max-width:560px;box-shadow:var(--shadow-lg);border:1px solid var(--line);animation:popIn .2s ease-out;margin:40px auto}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{padding:20px 24px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.modal-title{font-family:var(--serif);font-size:22px}
.modal-body{padding:20px 24px}
.modal-foot{padding:14px 24px 20px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);background:var(--bg-2);border-radius:0 0 18px 18px;flex-wrap:wrap}
.form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .form-row{margin-bottom:0}
.form-label{font-size:11.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted)}
.form-hint{font-size:12px;color:var(--muted);margin-top:4px}
.form-section{font-family:var(--serif);font-size:15px;margin:20px 0 10px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:18px}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{width:100%;padding:11px 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);font-size:15px;transition:border-color .15s,box-shadow .15s;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:60px;font-family:var(--sans)}
input[dir=rtl],textarea[dir=rtl]{font-family:'Geeza Pro','Tahoma',var(--sans);text-align:right}

/* File upload */
.file-upload{display:block;cursor:pointer;border:1.5px dashed var(--line-2);border-radius:12px;padding:18px;background:var(--surface);transition:border-color .15s;min-height:44px}
.file-upload:hover,.file-upload:active{border-color:var(--accent);background:var(--accent-soft)}
.file-upload-content{display:flex;align-items:center;gap:14px}
.file-upload-icon{width:40px;height:40px;border-radius:8px;background:var(--bg-2);color:var(--ink-2);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;flex-shrink:0}
.file-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.file-icon{width:40px;height:48px;flex-shrink:0;background:linear-gradient(135deg,#c9302c,#a02622);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border-radius:4px;font-family:var(--mono)}
.file-info{flex:1;min-width:0}
.file-name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-meta{font-size:12px;color:var(--muted);margin-top:2px}
.file-actions{display:flex;gap:6px;flex-wrap:wrap}
.file-hint{padding:14px;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:12px;font-size:13px;color:var(--muted);line-height:1.5}

/* Document grid */
.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.doc-card{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.doc-card:hover{border-color:var(--accent)}
.doc-card-title{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px}
.doc-card-title .icon{font-size:18px}
.doc-card-desc{font-size:12px;color:var(--muted);line-height:1.4}
.doc-card-actions{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}

.search-box{position:relative}
.search-box input{padding-left:34px;width:240px;background:var(--surface)}
.search-box::before{content:'⌕';position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);transition:all .15s;min-height:36px}
.chip:hover{border-color:var(--ink-2)}
.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.empty-title{font-family:var(--serif);font-size:22px;color:var(--ink-2);margin-bottom:6px}
.empty-msg{font-size:14px;margin-bottom:18px}

.split{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:18px}
.urgent-list{display:flex;flex-direction:column}
.urgent-item{padding:14px 22px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);min-height:60px}
.urgent-item:last-child{border-bottom:0}
.urgent-item:active{background:var(--surface-2)}
.urgent-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);font-size:14px;font-weight:600;color:var(--muted);flex-shrink:0;border:1px solid var(--line)}
.urgent-icon.red{background:var(--red-soft);color:var(--red);border-color:transparent}
.urgent-icon.amber{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.urgent-icon.yellow{background:var(--yellow-soft);color:var(--yellow);border-color:transparent}
.urgent-text{flex:1;min-width:0}
.urgent-title{font-weight:600;font-size:14px}
.urgent-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.urgent-date{font-size:12px;color:var(--muted);text-align:right;flex-shrink:0}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}

.setting-row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px 22px;border-bottom:1px solid var(--line)}
.setting-row:last-child{border-bottom:0}
.setting-label{font-weight:600;font-size:14.5px}
.setting-desc{font-size:13px;color:var(--muted);margin-top:3px;max-width:480px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:all .25s;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confirm-icon{width:48px;height:48px;border-radius:50%;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px}

/* PIN Lock */
.pin-screen{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column}
.pin-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:40px 36px;box-shadow:var(--shadow-lg);text-align:center;max-width:380px;width:90%}
.pin-box .pin-brand{font-family:var(--serif);font-size:32px;margin-bottom:4px}
.pin-box .pin-brand .dot{color:var(--accent)}
.pin-box .pin-sub{font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:28px}
.pin-box .pin-msg{font-size:15px;color:var(--ink-2);margin-bottom:20px;line-height:1.5}
.pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:24px}
.pin-dots .dc{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);transition:all .15s}
.pin-dots .dc.filled{background:var(--ink);border-color:var(--ink)}
.pin-dots .dc.error{background:var(--red);border-color:var(--red);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto}
.pin-key{width:100%;aspect-ratio:1.3;border-radius:14px;font-size:24px;font-weight:600;background:var(--bg-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;transition:background .1s,transform .08s;min-height:56px;user-select:none}
.pin-key:active{transform:scale(0.93);background:var(--line)}
.pin-key.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.pin-key.ghost{background:transparent;border-color:transparent;font-size:14px;color:var(--muted)}
.pin-error{color:var(--red);font-size:13px;margin-top:12px;min-height:20px}

/* Mobile */
@media (max-width:880px){
  .app{grid-template-columns:1fr}
  .sidebar{position:sticky;top:0;height:auto;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;align-items:center;gap:4px;padding:10px 12px;overflow-x:auto;z-index:10}
  .brand,.brand-sub,.nav-section,.sidebar-footer{display:none}
  .nav{flex-direction:row;gap:4px}
  .nav-item{padding:9px 14px;font-size:13px;white-space:nowrap;border-radius:8px}
  .content{padding:20px 16px 80px}
  .page-title{font-size:26px}
  .page-sub{font-size:12.5px}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-value{font-size:28px}
  .split{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .doc-grid{grid-template-columns:1fr}
  .modal{margin:10px auto;border-radius:14px}
  .modal-body{padding:16px 18px}
  .overlay{padding:10px}
  .search-box input{width:160px}
  table{font-size:13px}
  th,td{padding:10px}
}
@media print{.sidebar,.page-actions,.toolbar,.t-actions{display:none}.content{padding:0;max-width:100%}.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}body{background:#fff}}
</style>
</head>
<body>
<!-- Activation screen -->
<div class="pin-screen" id="activate-screen" style="display:none">
  <div class="pin-box">
    <div class="pin-brand">Ledger<span class="dot">.</span></div>
    <div class="pin-sub">Renewal Tracker</div>
    <div class="pin-msg">Enter activation code to set up this device</div>
    <div style="margin:20px 0">
      <input type="password" id="activate-input" placeholder="Activation code" style="text-align:center;letter-spacing:0.1em;font-size:16px">
    </div>
    <button class="btn btn-accent" style="width:100%;font-size:16px;padding:14px" onclick="checkActivation()">Activate</button>
    <div class="pin-error" id="activate-error"></div>
  </div>
</div>
<!-- PIN screen -->
<div class="pin-screen" id="pin-screen" style="display:none">
  <div class="pin-box">
    <div class="pin-brand">Ledger<span class="dot">.</span></div>
    <div class="pin-sub">Renewal Tracker</div>
    <div class="pin-msg" id="pin-msg">Enter your PIN to unlock</div>
    <div class="pin-dots" id="pin-dots"><div class="dc"></div><div class="dc"></div><div class="dc"></div><div class="dc"></div></div>
    <div class="pin-pad" id="pin-pad">
      <button class="pin-key" data-k="1">1</button><button class="pin-key" data-k="2">2</button><button class="pin-key" data-k="3">3</button>
      <button class="pin-key" data-k="4">4</button><button class="pin-key" data-k="5">5</button><button class="pin-key" data-k="6">6</button>
      <button class="pin-key" data-k="7">7</button><button class="pin-key" data-k="8">8</button><button class="pin-key" data-k="9">9</button>
      <button class="pin-key ghost" data-k="clear">Clear</button><button class="pin-key" data-k="0">0</button><button class="pin-key accent" data-k="ok">✓</button>
    </div>
    <div class="pin-error" id="pin-error"></div>
  </div>
</div>

<div class="app" id="app-main" style="display:none">
  <aside class="sidebar">
    <div class="brand">Ledger<span class="dot">.</span></div>
    <div class="brand-sub">Renewal Tracker</div>
    <nav class="nav">
      <button class="nav-item" data-view="dashboard">Dashboard <span class="badge" id="badge-dashboard" hidden></span></button>
      <div class="nav-section">Records</div>
      <button class="nav-item" data-view="businesses">Businesses <span class="badge" id="badge-businesses" hidden></span></button>
      <button class="nav-item" data-view="employees">Employees <span class="badge" id="badge-employees" hidden></span></button>
      <button class="nav-item" data-view="payments">Payments <span class="badge" id="badge-payments" hidden></span></button>
      <div class="nav-section">System</div>
      <button class="nav-item" data-view="settings">Settings</button>
    </nav>
    <div class="sidebar-footer">Data stored locally in your browser. Export regularly.</div>
  </aside>
  <main class="content" id="view"></main>
</div>

<div class="overlay" id="overlay"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ACTIVATION & PIN
   ========================================================= */
const ACT_KEY='ledger_activated_v1',ACT_CODE='Activation@1111',PIN_KEY='ledger_pin_v1';
let pinBuffer=[],pinMode='unlock',pinSetupValue='';

function checkActivation(){
  const v=document.getElementById('activate-input').value.trim();
  if(v===ACT_CODE){localStorage.setItem(ACT_KEY,'1');document.getElementById('activate-screen').style.display='none';document.getElementById('pin-screen').style.display='';initPIN()}
  else{document.getElementById('activate-error').textContent='Invalid activation code';document.getElementById('activate-input').value=''}
}
document.getElementById('activate-input').addEventListener('keydown',e=>{if(e.key==='Enter') checkActivation()});

function initPIN(){
  const a=localStorage.getItem(ACT_KEY),p=localStorage.getItem(PIN_KEY);
  if(!a&&!p){document.getElementById('activate-screen').style.display='';document.getElementById('pin-screen').style.display='none';return}
  document.getElementById('activate-screen').style.display='none';document.getElementById('pin-screen').style.display='';
  if(!p){pinMode='setup';document.getElementById('pin-msg').textContent='Create a 4-digit PIN'}
  else{pinMode='unlock';document.getElementById('pin-msg').textContent='Enter your PIN to unlock'}
  pinBuffer=[];updateDots();document.getElementById('pin-error').textContent='';
}
function handlePinKey(k){
  const err=document.getElementById('pin-error');err.textContent='';
  if(k==='clear'){pinBuffer=[];updateDots();return}
  if(k==='ok'){
    const pin=pinBuffer.join('');if(pin.length<4){err.textContent='Enter 4 digits';return}
    if(pinMode==='setup'){pinSetupValue=pin;pinMode='confirm';document.getElementById('pin-msg').textContent='Confirm your PIN';pinBuffer=[];updateDots();return}
    if(pinMode==='confirm'){if(pin===pinSetupValue){localStorage.setItem(PIN_KEY,pin);unlockApp();toast('PIN created')}else{showPinError("PINs don't match");pinMode='setup';document.getElementById('pin-msg').textContent='Create a 4-digit PIN';pinBuffer=[];updateDots()}return}
    if(pinMode==='unlock'){if(pin===localStorage.getItem(PIN_KEY)){unlockApp()}else{showPinError('Wrong PIN');pinBuffer=[];updateDots()}return}
    if(pinMode==='change'){pinSetupValue=pin;pinMode='change-confirm';document.getElementById('pin-msg').textContent='Confirm new PIN';pinBuffer=[];updateDots();return}
    if(pinMode==='change-confirm'){if(pin===pinSetupValue){localStorage.setItem(PIN_KEY,pin);unlockApp();toast('PIN changed')}else{showPinError("PINs don't match");pinMode='change';document.getElementById('pin-msg').textContent='Enter new 4-digit PIN';pinBuffer=[];updateDots()}return}
    return;
  }
  if(pinBuffer.length<4){pinBuffer.push(k);updateDots()}
}

function showPinError(m){document.getElementById('pin-error').textContent=m;document.querySelectorAll('#pin-dots .dc').forEach(d=>{d.classList.add('error');d.classList.remove('filled')});setTimeout(()=>document.querySelectorAll('#pin-dots .dc').forEach(d=>d.classList.remove('error')),500);pinBuffer=[]}

const STORE_KEY='ledger_renewal_v3',FILE_DB='ledger_files_v1';
const defaultState={businesses:[],employees:[],payments:[]};
let state=load();
function load(){try{const r=localStorage.getItem(STORE_KEY);if(!r){const v=localStorage.getItem('ledger_renewal_v2')||localStorage.getItem('ledger_renewal_v1');if(v){const o=JSON.parse(v);return{businesses:o.businesses||[],employees:o.employees||[],payments:o.payments||[]}}return JSON.parse(JSON.stringify(defaultState))}return{...defaultState,...JSON.parse(r)}}catch(e){return JSON.parse(JSON.stringify(defaultState))}}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
let _db;
function openFileDB(){if(_db) return Promise.resolve(_db);return new Promise((r,j)=>{const q=indexedDB.open(FILE_DB,1);q.onupgradeneeded=()=>q.result.createObjectStore('files');q.onsuccess=()=>{_db=q.result;r(_db)};q.onerror=()=>j(q.error)})}
function putFile(k,b){return openFileDB().then(d=>new Promise((r,j)=>{const t=d.transaction('files','readwrite');t.objectStore('files').put(b,k);t.oncomplete=()=>r();t.onerror=()=>j(t.error)}))}
function getFile(k){return openFileDB().then(d=>new Promise((r,j)=>{const t=d.transaction('files','readonly');const q=t.objectStore('files').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)}))}
function deleteFileFromDB(k){return openFileDB().then(d=>new Promise((r,j)=>{const t=d.transaction('files','readwrite');t.objectStore('files').delete(k);t.oncomplete=()=>r();t.onerror=()=>j(t.error)}))}

/* =========================================================
   HELPERS
   ========================================================= */
function todayISO(){const d=new Date();d.setHours(0,0,0,0);return d.toISOString().slice(0,10)}
function parseDate(s){if(!s) return null;const d=new Date(s+'T00:00:00');return isNaN(d)?null:d}
function fmtDate(s){const d=parseDate(s);if(!d) return '—';return d.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'})}
function fmtDateLong(s){const d=parseDate(s);if(!d) return '—';return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}
function fmtDateAr(s){const d=parseDate(s);if(!d) return '—';return d.toLocaleDateString('ar-BH',{day:'numeric',month:'long',year:'numeric'})}
function fmtDateNum(s){const d=parseDate(s);if(!d) return '—';return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}
function daysUntil(s){const d=parseDate(s);if(!d) return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/86400000)}
function addPeriod(iso,p){const d=parseDate(iso);if(!d) return iso;if(p==='monthly') d.setMonth(d.getMonth()+1);else if(p==='biannual') d.setMonth(d.getMonth()+6);else if(p==='yearly') d.setFullYear(d.getFullYear()+1);else if(p==='2years') d.setFullYear(d.getFullYear()+2);else if(p==='3years') d.setFullYear(d.getFullYear()+3);return d.toISOString().slice(0,10)}
function statusFor(d){if(d===null||d===undefined) return{key:'gray',label:'No date'};if(d<0) return{key:'red',label:'Overdue '+Math.abs(d)+'d'};if(d<=30) return{key:'red',label:d+'d left'};if(d<=60) return{key:'amber',label:d+'d left'};if(d<=90) return{key:'yellow',label:d+'d left'};return{key:'green',label:d+'d left'}}
function labelPeriod(p){return({monthly:'Monthly',biannual:'Every 6 months',yearly:'Yearly','2years':'Every 2 years','3years':'Every 3 years'})[p]||p||'—'}
function fmtFileSize(b){if(!b) return '';if(b<1024) return b+' B';if(b<1024*1024) return(b/1024).toFixed(1)+' KB';return(b/1024/1024).toFixed(2)+' MB'}
function formatMoney(a){if(a==null||a==='') return '';return 'BHD '+Number(a).toLocaleString(undefined,{minimumFractionDigits:3,maximumFractionDigits:3})}
function composeAddr(b){const p=[];if(b.addrBuilding) p.push('Building '+b.addrBuilding);if(b.addrRoad) p.push('Road '+b.addrRoad);if(b.addrBlock) p.push('Block '+b.addrBlock);if(b.addrCity) p.push(b.addrCity);if(b.addrCountry) p.push(b.addrCountry);return p.join(', ')||b.address||''}
function composeAddrAr(b){const p=[];if(b.addrBuilding) p.push('مبنى '+b.addrBuilding);if(b.addrRoad) p.push('طريق '+b.addrRoad);if(b.addrBlock) p.push('مجمع '+b.addrBlock);if(b.addrCityAr) p.push(b.addrCityAr);if(b.addrCountryAr) p.push(b.addrCountryAr);return p.join('، ')||b.addressAr||''}
function durationBetween(s,e){const a=parseDate(s),b=parseDate(e);if(!a||!b) return '';let m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());if(b.getDate()<a.getDate()) m--;if(m<0) return '';const y=Math.floor(m/12),r=m%12;return[y?y+' year'+(y!==1?'s':''):'',r?r+' month'+(r!==1?'s':''):''].filter(Boolean).join(' ')}
function durationBetweenAr(s,e){const a=parseDate(s),b=parseDate(e);if(!a||!b) return '';let m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());if(b.getDate()<a.getDate()) m--;if(m<0) return '';const y=Math.floor(m/12),r=m%12;const yP=y?(y===1?'سنة':y===2?'سنتان':y+' سنوات'):'';const mP=r?(r===1?'شهر':r===2?'شهران':r+' أشهر'):'';return[yP,mP].filter(Boolean).join(' و')}
function yearsBetween(s){const d=parseDate(s);if(!d) return '';const now=new Date();let y=now.getFullYear()-d.getFullYear();let m=now.getMonth()-d.getMonth();if(m<0){y--;m+=12}return y>0?(y+' year'+(y!==1?'s':'')+(m>0?' '+m+' month'+(m!==1?'s':''):'')):(m+' month'+(m!==1?'s':''))}

async function attachFile(rt,ri,fn,file){if(!file) return;if(file.size>20*1024*1024){if(!confirm('File >20MB. Continue?')) return}const key=rt+'-'+ri+'-'+fn+'-'+uid();await putFile(key,file);const c=rt==='biz'?state.businesses:state.employees;const r=c.find(x=>x.id===ri);if(!r) return;if(r[fn]&&r[fn].key){try{await deleteFileFromDB(r[fn].key)}catch(e){}}r[fn]={key,name:file.name,size:file.size,type:file.type,uploadedAt:todayISO()};save();refreshFileSection(rt,ri,fn);toast('File attached');render()}
async function viewAttachment(rt,ri,fn){const c=rt==='biz'?state.businesses:state.employees;const r=c.find(x=>x.id===ri);if(!r||!r[fn]) return;const b=await getFile(r[fn].key);if(!b){toast('File not found');return}const u=URL.createObjectURL(b);const nm=r[fn].name||'document.pdf';const p=document.createElement('div');p.id='doc-preview';p.style.cssText='position:fixed;inset:0;z-index:100;background:#333;display:flex;flex-direction:column;';const bar=document.createElement('div');bar.style.cssText='background:#1c1c1a;color:#f5f2ec;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;gap:12px;min-height:50px;';bar.innerHTML=`<button style="background:#f5f2ec;color:#1c1c1a;border:0;padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer" onclick="closeDocPreview()">← Back</button><span style="font-size:13px;opacity:0.7;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHTML(nm)}</span><a href="${u}" download="${escapeHTML(nm)}" style="background:#0d6d56;color:#fff;border:0;padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;text-decoration:none">Download</a>`;const ifr=document.createElement('iframe');ifr.src=u;ifr.style.cssText='flex:1;border:0;width:100%;background:#fff;';p.appendChild(bar);p.appendChild(ifr);document.body.appendChild(p)}
async function downloadAttachment(rt,ri,fn){const c=rt==='biz'?state.businesses:state.employees;const r=c.find(x=>x.id===ri);if(!r||!r[fn]) return;const b=await getFile(r[fn].key);if(!b){toast('File not found');return}const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=r[fn].name||'document.pdf';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(u),5000);toast('Downloading…')}
async function removeAttachment(rt,ri,fn){if(!confirm('Remove this file?')) return;const c=rt==='biz'?state.businesses:state.employees;const r=c.find(x=>x.id===ri);if(!r||!r[fn]) return;try{await deleteFileFromDB(r[fn].key)}catch(e){}delete r[fn];save();refreshFileSection(rt,ri,fn);toast('File removed');render()}
function renderFileSection(rt,ri,fn,rec){

function previewDocument(html){html=html.replace(/<div class="print-bar">[\s\S]*?<\/div>/,'');const p=document.createElement('div');p.id='doc-preview';p.style.cssText='position:fixed;inset:0;z-index:100;background:#f0eee8;display:flex;flex-direction:column;';const bar=document.createElement('div');bar.style.cssText='background:#1c1c1a;color:#f5f2ec;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;gap:12px;min-height:50px;';bar.innerHTML=`<button style="background:#f5f2ec;color:#1c1c1a;border:0;padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;font-family:var(--sans)" onclick="closeDocPreview()">← Back</button><button style="background:#0d6d56;color:#fff;border:0;padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;font-family:var(--sans)" onclick="printDocPreview()">Print / Save as PDF</button>`;const ifr=document.createElement('iframe');ifr.id='doc-preview-frame';ifr.style.cssText='flex:1;border:0;width:100%;background:#fff;';p.appendChild(bar);p.appendChild(ifr);document.body.appendChild(p);const d=ifr.contentDocument||ifr.contentWindow.document;d.open();d.write(html);d.close()}

function allItems(){

  state.businesses.forEach(b=>{if(b.crExpiry) items.push({id:'biz-'+b.id,kind:'CR Renewal',title:b.name,sub:'CR #'+(b.crNumber||'—'),date:b.crExpiry,renew:()=>renewBusiness(b.id),view:()=>{switchView('businesses');setTimeout(()=>openBusinessForm(b),50)}})});
  state.employees.forEach(e=>{const biz=state.businesses.find(b=>b.id===e.businessId);const sub='Employee at '+(biz?biz.name:'—');
    if(e.cprExpiry) items.push({id:'cpr-'+e.id,kind:'CPR Expiry',title:e.name+' — CPR',sub,date:e.cprExpiry,renew:()=>renewEmployeeField(e.id,'cprExpiry','yearly'),view:()=>{switchView('employees');setTimeout(()=>openEmployeeForm(e),50)}});

  state.payments.forEach(p=>{const biz=state.businesses.find(b=>b.id===p.businessId);if(p.nextDue) items.push({id:'pay-'+p.id,kind:'Payment',title:p.name,sub:(biz?biz.name+' · ':'')+formatMoney(p.amount)+' · '+labelPeriod(p.frequency),date:p.nextDue,renew:()=>markPaid(p.id),view:()=>{switchView('payments');setTimeout(()=>openPaymentForm(p),50)}})});

`:'<div class="form-section">Documents</div><div class="file-hint">Save the employee first, then re-open to upload documents and generate contracts.</div>'}`,

function generateContractHTML(c,e,b){const f=(x,y)=>x&&x.trim()?x:(y||'');const en=e.name,ar=f(e.nameAr,en),bn=b.name,ba=f(b.nameAr,bn),addr=composeAddr(b),addrA=f(composeAddrAr(b),addr),pos=c.position||e.position||'',posA=f(c.positionAr,pos),pp=e.passportNumber||'',cpr=e.cprNumber||'',nat=e.nationality||'',dur=durationBetween(c.startDate,c.endDate),durA=durationBetweenAr(c.startDate,c.endDate),sE=fmtDateLong(c.startDate),eE=fmtDateLong(c.endDate),sA=fmtDateAr(c.startDate),eA=fmtDateAr(c.endDate),td=fmtDateLong(c.createdAt||todayISO()),tA=fmtDateAr(c.createdAt||todayISO()),sal=Number(c.basicSalary)||0,all=Number(c.allowanceAmount)||0;
const secs=[];let n=1;
secs.push({n:n++,tE:'Job Duties',tA:'مهام الوظيفة',e:`The Second Party agrees to perform the duties of ${pos} as assigned by the First Party, and to follow all company policies and applicable Bahraini labour law.`,a:`يوافق الطرف الثاني على أداء مهام ${posA} كما يحددها الطرف الأول، والالتزام بجميع سياسات الشركة وقانون العمل البحريني.`});
secs.push({n:n++,tE:'Working Hours',tA:'ساعات العمل',e:`Standard working hours are ${c.hoursPerDay} hours per day, ${c.daysPerWeek} days per week. The weekly rest day is ${c.restDay}.`,a:`ساعات العمل المعتادة هي ${c.hoursPerDay} ساعات في اليوم، ${c.daysPerWeek} أيام في الأسبوع. يوم الراحة الأسبوعي هو ${c.restDay}.`});
secs.push({n:n++,tE:'Salary and Benefits',tA:'الراتب والمزايا',e:`The Second Party shall receive a monthly basic salary of BHD ${sal.toFixed(3)}${all?`, and a ${c.allowanceType.toLowerCase()} of BHD ${all.toFixed(3)}`:''}, along with any other agreed benefits.`,a:`يتقاضى الطرف الثاني راتباً أساسياً شهرياً قدره ${sal.toFixed(3)} دينار بحريني${all?`، و${c.allowanceTypeAr} قدره ${all.toFixed(3)} دينار بحريني`:''}، بالإضافة إلى أي مزايا أخرى متفق عليها.`});
secs.push({n:n++,tE:'Annual Leave',tA:'الإجازة السنوية',e:`The Second Party is entitled to ${c.annualLeaveDays} calendar days of paid annual leave per year after one year of service.`,a:`يستحق الطرف الثاني ${c.annualLeaveDays} يوماً تقويمياً من الإجازة السنوية مدفوعة الأجر سنوياً بعد إكمال سنة من الخدمة.`});
if(c.probationMonths>0) secs.push({n:n++,tE:'Probation Period',tA:'فترة التجربة',e:`The Second Party shall serve a probation period of ${c.probationMonths} month${c.probationMonths!==1?'s':''} from the start date. Either party may terminate with one day's written notice during this period.`,a:`يخضع الطرف الثاني لفترة تجربة قدرها ${c.probationMonths} ${c.probationMonths===1?'شهر':c.probationMonths===2?'شهران':'أشهر'} من تاريخ بدء العقد.`});

return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Contract — ${escapeHTML(en)}</title><style>@page{size:A4;margin:0}*{box-sizing:border-box}body{font-family:'Helvetica Neue','Segoe UI',Arial,sans-serif;font-size:8.5pt;line-height:1.35;color:#1a1a1a;margin:0;padding:20px;background:#eee}.page{background:#fff;max-width:210mm;min-height:297mm;margin:0 auto;padding:12mm 14mm;box-shadow:0 2px 20px rgba(0,0,0,0.1)}table.p{width:100%;border-collapse:collapse;font-size:7.5pt;margin:6px 0 10px}table.p td{padding:2.5px 6px;border-bottom:1px solid #eae5da;vertical-align:top}table.p .l{color:#555;width:26%;font-weight:600;white-space:nowrap}table.p .ar{font-family:'Geeza Pro','Tahoma',sans-serif;direction:rtl;text-align:right}.sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:24px;text-align:center;font-size:8pt}.sig-line{border-top:1px solid #1a1a1a;padding-top:6px}.sig-line .a{font-family:'Geeza Pro','Tahoma',sans-serif;direction:rtl;display:block;margin-top:1px}@media print{body{background:#fff;padding:0}.page{box-shadow:none;padding:12mm 14mm;max-width:none;margin:0;min-height:auto}}</style></head><body><div class="page"><div style="text-align:center;border-bottom:2px solid #1a1a1a;padding-bottom:8px;margin-bottom:10px"><div style="font-size:15pt;font-weight:800">Employment Contract</div><div style="font-size:13pt;font-family:'Geeza Pro','Tahoma',sans-serif;direction:rtl;margin-top:2px">عقد عمل محدد المدة</div><div style="font-size:8pt;color:#555;margin-top:4px">${td} · ${tA}</div></div><table class="p"><tr><td class="l">First Party (Employer)</td><td>${escapeHTML(bn)}</td><td class="l ar">الطرف الأول (صاحب العمل)</td><td class="ar">${escapeHTML(ba)}</td></tr><tr><td class="l">CR Number</td><td>${escapeHTML(b.crNumber||'—')}</td><td class="l ar">رقم السجل التجاري</td><td class="ar">${escapeHTML(b.crNumber||'—')}</td></tr><tr><td class="l">Address</td><td>${escapeHTML(addr)}</td><td class="l ar">العنوان</td><td class="ar">${escapeHTML(addrA)}</ /* Contingency Plan */
function generateContingencyPlan(empId){const e=state.employees.find(x=>x.id===empId);if(!e) return;const biz=state.businesses.find(b=>b.id===e.businessId);if(!biz){toast('Business not found');return}
const owner=biz.ownerName||'[Owner Name]';const bizName=biz.name;const endDate=e.visaExpiry?fmtDateLong(e.visaExpiry):'[Contract End Date]';const today=fmtDateLong(todayISO());
const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Contingency Plan — ${escapeHTML(e.name)}</title><style>@page{size:A4;margin:0}*{box-sizing:border-box}body{font-family:'Helvetica Neue','Segoe UI',Arial,sans-serif;font-size:11pt;line-height:1.7;color:#1a1a1a;margin:0;padding:20px;background:#eee}.page{background:#fff;max-width:210mm;margin:0 auto;padding:20mm;box-shadow:0 2px 20px rgba(0,0,0,0.1)}.header{text-align:center;margin-bottom:30px}.header .date{font-size:10pt;color:#555}.header h2{font-size:14pt;margin:12px 0 4px;text-transform:uppercase;letter-spacing:0.05em}.header .biz{font-size:12pt;font-weight:700;margin-bottom:4px}p{margin:14px 0;text-align:justify}.sig{margin-top:50px}.sig-name{font-weight:700;margin-top:30px}.sig-role{color:#555;font-size:10pt}@media print{body{background:#fff;padding:0}.page{box-shadow:none;padding:20mm;max-width:none;margin:0}}</style></head><body><div class="page"><div class="header"><div class="date">${today}</div><div class="biz">${escapeHTML(bizName)}</div><h2>Contingency Plan</h2></div><p>I, <strong>${escapeHTML(owner)}</strong>, Owner, wish to convey this contingency plan related to the employment of <strong>${escapeHTML(e.name)}</strong>, a ${escapeHTML(e.nationality||'')} worker who is currently employed on the renewable period of ${endDate} contract under ${escapeHTML(bizName)}. This plan covers the remedial measure that should apply in the event of any contingency (i.e. natural calamity, man-made disaster and war).</p><p>In the course of any impending contingency, we shall strive our best to repatriate the employee to their point of origin at the soonest possible time via a safe course of travel.</p><p>If repatriation measure is not possible as prompted by the prevailing circumstances that may occur, I shall provide continuous support to the employee (i.e., food, medicines, clothing and safe shelter) and constant communication with the update of their living condition to their family.</p><p>Our company shall provide a personal accident insurance with a reputable insurance company in the Kingdom of Bahrain in favor of the employee that will cover benefits for their beneficiaries during their employment.</p><p>AND BY VIRTUE OF THIS LETTER, our company pledges to give the employee reasonable treatment for their well-being in accordance with the job contract.</p><div class="sig"><div class="sig-name">${escapeHTML(owner)}</div><div class="sig-role">(Employer)</div></div></div></body></html>`;
previewDocument(html)}

function openReport(){const items=allItems();const overdue=items.filter(i=>i.days!==null&&i.days<0);const upcoming=items.filter(i=>i.days!==null&&i.days>=0&&i.days<=20);const today=fmtDateLong(todayISO());const todayAr=fmtDateAr(todayISO());const bizNames=state.businesses.map(b=>b.name).join(' · ');

-t .ar{font-size:10pt;color:#666;margin-top:2px;text-align:right}.c-nm{font-size:10pt;font-weight:700}.c-d{font-size:9.5pt;font-variant-numeric:tabular-nums;white-space:nowrap;color:#333}.c-s{width:135px}.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:8.5pt;font-weight:700;white-space:nowrap}.badge.overdue{background:#fbe9e7;color:#b3261e}.badge.urgent{background:#fbeed1;color:#a86b00}.badge.soon{background:#f7f0d3;color:#8a7414}.badge.normal{background:#e6efe2;color:#3a6b3a}.badge-ar{font-size:9.5pt;color:#888;margin-top:4px;text-align:right}.rf{margin-top:18px;padding-top:10px;border-top:1.5px solid #e0dbd0;display:flex;justify-content:space-between;font-size:8.5pt;color:#aaa}.rf .ar{font-size:9.5pt;text-align:right}@media print{body{background:#fff;padding:0}.page{box-shadow:none;padding:14mm 16mm;max-width:none;margin:0}}</style></head><body><div class="page"><div class="rh"><h1>Renewal & Payment Report</h1><div class="ar at">تقرير التجديدات والمدفوعات</div><div class="dr"><span>${today}</span><span>·</span><span class="ar" style="display:inline">${todayAr}</span></div><div class="bz">${escapeHTML(bizNames)}</div></div><div class="rs"><div class="sc red"><div class="sn">${overdue.length}</div><div class="se">Overdue</div><div class="ar sa">متأخر</div></div><div class="sc amb"><div class="sn">${upcoming.length}</div><div class="se">Due within 20 days</div><div class="ar sa">مستحق خلال ٢٠ يوم</div></div></div>${all.length?`<div class="th"><span class="en">Items Requiring Action</span><span class="ar">العناصر التي تتطلب إجراء</span></div><table><thead><tr><th>#</th><th>Type / النوع</th><th>Name / الاسم</th><th>Due / التاريخ</th><th>Status / الحالة</th></tr></thead><tbody>${renderRows(all)}</tbody></table>`:`<div style="text-align:center;padding:50px 20px"><div style="font-size:18pt;font-weight:600;color:#3a6b3a">✓ All Clear</div><p style="color:#888;margin-top:6px">No items due in the next 20 days.</p></div>`}<div class="rf"><span>${state. ${state.businesses.length>1?`<div class="toolbar"><div class="chips">${bizChips}</div></div>`:''}
<div class="card">${rows.length?`<div class="table-wrap"><table><thead><tr><th>Payment</th><th>Business</th><th>Amount</th><th>Frequency</th><th>Next due</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(p=>{const biz=state.businesses.find(b=>b.id===p.businessId);const s=statusFor(daysUntil(p.nextDue));return `<tr><td><div class="t-name">${escapeHTML(p.name)}</div></td><td>${biz?escapeHTML(biz.name):'—'}</td><td class="t-mono">${formatMoney(p.amount)}</td><td>${labelPeriod(p.frequency)}</td><td>${p.nextDue?fmtDate(p.nextDue):'—'}</td><td>${p.nextDue?`<span class="pill ${s.key}">${s.label}</span>`:'—'}</td><td><div class="t-actions"><button class="btn btn-sm" data-paid="${p.id}">Paid</button><button class="btn btn-sm btn-ghost" data-edit-pay="${p.id}">Edit</button></div></td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><div class="empty-title">No payments yet</div><button class="btn btn-accent" onclick="openPaymentForm()">＋ Add a payment</button></div>`}</div>`}

openModal({title:isEdit?'Edit payment':'New payment',body:`

<div class="form-row"><label class="form-label">Notes</label><textarea id="f-notes">${escapeHTML(p.notes||'')}</textarea></div>`,
actions:[isEdit?{label:'Delete',cls:'btn-danger btn-ghost',handler:()=>{closeModal();confirmDialog('Delete payment?','',()=>deletePayment(p.id))}}:null,{label:'Cancel',cls:'btn-ghost',handler:closeModal},{label:isEdit?'Save':'Add payment',cls:'btn-accent',handler:()=>{const d={id:p.id,name:val('f-name'),businessId:val('f-biz'),amount:val('f-amount'),frequency:val('f-freq'),nextDue:val('f-due'),notes:val('f-notes')};if(!d.name) return toast('Name required');savePayment(d);closeModal();toast(isEdit?'Saved':'Payment added')}}].filter(Boolean)})}

<div class="setting-row"><div><div class="setting-label">Change PIN</div><div class="setting-desc">Set a new 4-digit PIN for this device.</div></div><button class="btn" onclick="showPinScreen('change')">Change</button></div></div>
<div class="card" style="max-width:760px;margin-top:20px"><div class="card-head"><div class="card-title" style="color:var(--red)">Danger Zone</div></div>
<div class="setting-row"><div><div class="setting-label">Reset everything</div><div class="setting-desc">Delete all data and PDFs. Cannot be undone.</div></div><button class="btn btn-danger" onclick="confirmDialog('Erase all data?','Permanently deletes everything.',resetAll)">Reset</button></div></div>`}

async function resetAll(){for(const b of state.businesses){if(b.crFile)try{await deleteFileFromDB(b.crFile.key)}catch(e){}}for(const e of state.employees){for(const fn of['permitFile','residencyFile']){if(e[fn]&&e[fn].key)try{await deleteFileFromDB(e[fn].key)}catch(err){}}}state=JSON.parse(JSON.stringify(defaultState));save();render();toast('All data cleared')}
async function exportData(){toast('Preparing…');const out={businesses:state.businesses,employees:state.employees,payments:state.payments,files:{}};const keys=[];state.businesses.forEach(b=>{if(b.crFile)keys.push(b.crFile.key)});state.employees.forEach(e=>{for(const fn of['permitFile','residencyFile']){if(e[fn])keys.push(e[fn].key)}});for(const k of keys){try{const b=await getFile(k);if(b){out.files[k]={data:await blobToBase64(b),type:b.type}}}catch(e){}}const blob=new Blob([JSON.stringify(out)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='ledger-backup-'+todayISO()+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);toast('Backup downloaded')}
function blobToBase64(b){return new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.onerror=()=>j(f.error);f.readAsDataURL(b)})}
function base64ToBlob(b,t){const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);return new Blob([a],{type:t||'application/pdf'})}
async function importData(file){if(!file) return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.businesses) throw 0;if(!confirm('Replace all data?')) return;await resetAll();state.businesses=d.businesses||[];state.employees=d.employees||[];state.payments=d.payments||[];if(d.files){for(const k of Object.keys(d.files)){await putFile(k,base64ToBlob(d.files[k].data,d.files[k].type))}}save();render();toast('Restored')}catch(e){toast('Invalid file')}};r.readAsText(file)}

/* =========================================================
   MODAL / TOAST / EVENTS
   ========================================================= */
function openModal({title,body,actions,wide}){const ov=document.getElementById('overlay');ov.innerHTML=`<div class="modal" style="${wide?'max-width:720px':''}"><div class="modal-head"><div class="modal-title">${escapeHTML(title)}</div><button class="btn" style="padding:6px 10px;font-size:18px;min-height:36px" onclick="closeModal()">✕</button></div><div class="modal-body">${body}</div><div class="modal-foot" id="modal-foot"></div></div>`;const foot=ov.querySelector('#modal-foot');actions.forEach(a=>{const b=document.createElement('button');b.className='btn '+(a.cls||'');b.textContent=a.label;b.onclick=a.handler;foot.appendChild(b)});ov.classList.add('open');setTimeout(()=>{const i=ov.querySelector('input:not([type=file]):not([type=checkbox]),select,textarea');if(i) i.focus()},80)}
function closeModal(){document.getElementById('overlay').classList.remove('open')}
function confirmDialog(t,m,fn){openModal({title:t,body:`<div class="confirm-icon">!</div><div style="font-size:14px;color:var(--ink-2)">${escapeHTML(m)}</div>`,actions:[{label:'Cancel',cls:'btn-ghost',handler:closeModal},{label:'Yes, do it',cls:'btn-danger',handler:()=>{closeModal();fn()}}]})}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400)}

function bindViewEvents(){
  document.querySelectorAll('[data-search]').forEach(el=>{el.addEventListener('input',e=>{filters.search=e.target.value;render();setTimeout(()=>{const i=document.querySelector('[data-search]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},10)})});
  document.querySelectorAll('[data-biz-filter]').forEach(el=>el.addEventListener('click',()=>{filters.biz=el.dataset.bizFilter;render()}));
  document.querySelectorAll('[data-renew-biz]').forEach(el=>el.addEventListener('click',()=>renewBusiness(el.dataset.renewBiz)));
  document.querySelectorAll('[data-edit-biz]').forEach(el=>el.addEventListener('click',()=>{const b=state.businesses.find(x=>x.id===el.dataset.editBiz);openBusinessForm(b)}));
  document.querySelectorAll('[data-edit-emp]').forEach(el=>el.addEventListener('click',()=>{const e=state.employees.find(x=>x.id===el.dataset.editEmp);openEmployeeForm(e)}));
  document.querySelectorAll('[data-del-emp]').forEach(el=>el.addEventListener('click',()=>{const e=state.employees.find(x=>x.id===el.dataset.delEmp);confirmDialog('Remove '+e?.name+'?','',()=>deleteEmployee(el.dataset.delEmp))}));
  document.querySelectorAll('[data-edit-pay]').forEach(el=>el.addEventListener('click',()=>{const p=state.payments.find(x=>x.id===el.dataset.editPay);openPaymentForm(p)}));
  document.querySelectorAll('[data-paid]').forEach(el=>el.addEventListener('click',()=>markPaid(el.dataset.paid)));
  document.querySelectorAll('[data-renew]').forEach(el=>el.addEventListener('click',()=>{const i=allItems().find(x=>x.id===el.dataset.renew);if(i) i.renew()}));
}

document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>switchView(n.dataset.view)));
document.getElementById('overlay').addEventListener('click',e=>{});
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeModal()});

function val(id){const el=document.getElementById(id);return el?el.value.trim():''}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}

switchView('dashboard');
</script>
