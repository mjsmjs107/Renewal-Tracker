<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Business Renewal Tracker</title>
<style>
:root{
  --bg:#f5f2ec;--bg-2:#efebe2;--surface:#ffffff;--surface-2:#faf8f3;
  --ink:#1c1c1a;--ink-2:#3d3d39;--muted:#7a766e;
  --line:#e3ddd0;--line-2:#cfc8b7;
  --accent:#0d6d56;--accent-ink:#074231;--accent-soft:#e3efe9;
  --red:#b3261e;--red-soft:#fbe9e7;
  --amber:#a86b00;--amber-soft:#fbeed1;
  --yellow:#8a7414;--yellow-soft:#f7f0d3;
  --green:#3a6b3a;--green-soft:#e6efe2;
  --shadow:0 1px 0 rgba(0,0,0,0.04), 0 8px 28px -16px rgba(0,0,0,0.08);
  --shadow-lg:0 4px 16px -4px rgba(0,0,0,0.06), 0 20px 50px -20px rgba(0,0,0,0.18);
  --serif:'Iowan Old Style','Charter','Source Serif Pro','Georgia',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','SF Pro Text','Helvetica Neue',system-ui,sans-serif;
  --mono:'SF Mono','Menlo','Consolas',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}

.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{background:var(--bg-2);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{font-family:var(--serif);font-size:24px;letter-spacing:-0.02em;margin-bottom:4px;padding:4px 12px}
.brand .dot{color:var(--accent)}
.brand-sub{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);padding:0 12px;margin-bottom:28px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-section{font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);padding:16px 12px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--ink-2);font-size:14px;font-weight:500;transition:background .15s,color .15s;text-align:left;width:100%}
.nav-item:hover{background:rgba(0,0,0,0.04);color:var(--ink)}
.nav-item.active{background:var(--ink);color:var(--bg)}
.nav-item .badge{margin-left:auto;font-size:11px;background:var(--red);color:#fff;padding:1px 7px;border-radius:999px;font-weight:600;font-variant-numeric:tabular-nums}
.nav-item.active .badge{background:#fff;color:var(--ink)}
.sidebar-footer{margin-top:auto;padding:12px;font-size:11px;color:var(--muted);line-height:1.5}

.content{padding:32px 40px 80px;max-width:1400px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;gap:24px;flex-wrap:wrap}
.page-title{font-family:var(--serif);font-size:38px;letter-spacing:-0.02em;line-height:1.05}
.page-sub{color:var(--muted);font-size:13.5px;margin-top:4px;max-width:560px}
.page-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:500;border:1px solid var(--line-2);background:var(--surface);transition:transform .08s,box-shadow .15s,background .15s,border-color .15s;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--ink-2)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-primary:hover{background:#000;border-color:#000}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-accent:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:rgba(0,0,0,0.05);border-color:transparent}
.btn-danger{color:var(--red);border-color:var(--line-2)}
.btn-danger:hover{background:var(--red-soft);border-color:var(--red)}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:6px}
.btn-icon{padding:6px;border-radius:6px;width:30px;height:30px;justify-content:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card-pad{padding:22px 24px}
.card-head{padding:18px 24px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-title{font-family:var(--serif);font-size:18px;letter-spacing:-0.01em}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;position:relative;overflow:hidden}
.stat-label{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat-value{font-family:var(--serif);font-size:36px;letter-spacing:-0.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.stat-meta{font-size:12px;color:var(--muted);margin-top:4px}
.stat.alert .stat-value{color:var(--red)}
.stat.warn .stat-value{color:var(--amber)}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surface-2)}
.t-name{font-weight:600;color:var(--ink)}
.t-sub{font-size:12px;color:var(--muted);margin-top:2px}
.t-actions{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.t-mono{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.t-attach{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:500;font-size:12px;cursor:pointer;margin-left:8px}
.t-attach:hover{text-decoration:underline}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:0.02em;white-space:nowrap}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.yellow{background:var(--yellow-soft);color:var(--yellow)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.gray{background:#ececec;color:#666}

.overlay{position:fixed;inset:0;background:rgba(28,28,26,0.4);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:60px 20px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--bg);border-radius:18px;width:100%;max-width:560px;box-shadow:var(--shadow-lg);border:1px solid var(--line);animation:popIn .2s ease-out}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{padding:22px 26px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.modal-title{font-family:var(--serif);font-size:22px;letter-spacing:-0.01em}
.modal-body{padding:22px 26px}
.modal-foot{padding:16px 26px 22px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);background:var(--bg-2);border-radius:0 0 18px 18px}
.form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .form-row{margin-bottom:0}
.form-label{font-size:11.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted)}
.form-hint{font-size:12px;color:var(--muted);margin-top:4px}
.form-section{font-family:var(--serif);font-size:15px;margin:20px 0 10px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:18px}
.form-section:first-of-type{border-top:0;padding-top:0;margin-top:18px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:9px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);font-size:14px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:60px;font-family:var(--sans)}
input[dir=rtl],textarea[dir=rtl]{font-family:'Geeza Pro','Tahoma',var(--sans);text-align:right}

.check-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0}
.check-row input[type=checkbox]{margin-top:3px;width:16px;height:16px;cursor:pointer;accent-color:var(--accent)}
.check-row label{font-size:13.5px;cursor:pointer}
.check-row .desc{font-size:12px;color:var(--muted);margin-top:2px}

.file-upload{display:block;cursor:pointer;border:1.5px dashed var(--line-2);border-radius:10px;padding:18px;background:var(--surface);transition:border-color .15s,background .15s}
.file-upload:hover{border-color:var(--accent);background:var(--accent-soft)}
.file-upload-content{display:flex;align-items:center;gap:14px}
.file-upload-icon{width:40px;height:40px;border-radius:8px;background:var(--bg-2);color:var(--ink-2);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;flex-shrink:0}
.file-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.file-icon{width:40px;height:48px;flex-shrink:0;background:linear-gradient(135deg,#c9302c,#a02622);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;letter-spacing:0.05em;border-radius:4px;font-family:var(--mono)}
.file-info{flex:1;min-width:0}
.file-name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-meta{font-size:12px;color:var(--muted);margin-top:2px}
.file-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.file-hint{padding:14px;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:10px;font-size:13px;color:var(--muted);line-height:1.5}

.contract-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.contract-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.contract-info{flex:1;min-width:0}
.contract-title{font-weight:600;font-size:13.5px}
.contract-meta{font-size:12px;color:var(--muted);margin-top:2px}

.search-box{position:relative}
.search-box input{padding-left:34px;width:240px;background:var(--surface)}
.search-box::before{content:'⌕';position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);transition:all .15s}
.chip:hover{border-color:var(--ink-2)}
.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty-title{font-family:var(--serif);font-size:22px;color:var(--ink-2);margin-bottom:6px;letter-spacing:-0.01em}
.empty-msg{font-size:14px;margin-bottom:18px}

.split{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-bottom:20px}
@media (max-width:1100px){.split{grid-template-columns:1fr}}

.urgent-list{display:flex;flex-direction:column}
.urgent-item{padding:14px 24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line)}
.urgent-item:last-child{border-bottom:0}
.urgent-item:hover{background:var(--surface-2)}
.urgent-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);font-size:14px;font-weight:600;color:var(--muted);flex-shrink:0;border:1px solid var(--line)}
.urgent-icon.red{background:var(--red-soft);color:var(--red);border-color:transparent}
.urgent-icon.amber{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.urgent-icon.yellow{background:var(--yellow-soft);color:var(--yellow);border-color:transparent}
.urgent-text{flex:1;min-width:0}
.urgent-title{font-weight:600;font-size:14px}
.urgent-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.urgent-date{font-size:12px;color:var(--muted);text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}

.setting-row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px 24px;border-bottom:1px solid var(--line)}
.setting-row:last-child{border-bottom:0}
.setting-label{font-weight:600;font-size:14.5px}
.setting-desc{font-size:13px;color:var(--muted);margin-top:3px;max-width:480px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:all .25s;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.confirm-icon{width:48px;height:48px;border-radius:50%;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px}

@media (max-width:880px){
  .app{grid-template-columns:1fr}
  .sidebar{position:sticky;top:0;height:auto;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;align-items:center;gap:8px;padding:14px 16px;overflow-x:auto}
  .brand,.brand-sub,.nav-section,.sidebar-footer{display:none}
  .nav{flex-direction:row;gap:4px}
  .nav-item{padding:7px 12px;font-size:13px;white-space:nowrap}
  .content{padding:24px 20px 60px}
  .page-title{font-size:30px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:1fr}
}
@media print{
  .sidebar,.page-actions,.toolbar,.t-actions{display:none}
  .content{padding:0;max-width:100%}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  body{background:#fff}
}
/* PIN Lock */
.pin-screen{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column}
.pin-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:40px 36px;box-shadow:var(--shadow-lg);text-align:center;max-width:380px;width:90%}
.pin-box .pin-brand{font-family:var(--serif);font-size:32px;letter-spacing:-0.02em;margin-bottom:4px}
.pin-box .pin-brand .dot{color:var(--accent)}
.pin-box .pin-sub{font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:28px}
.pin-box .pin-msg{font-size:14.5px;color:var(--ink-2);margin-bottom:20px;line-height:1.5}
.pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:24px}
.pin-dots .dc{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);background:transparent;transition:all .15s}
.pin-dots .dc.filled{background:var(--ink);border-color:var(--ink)}
.pin-dots .dc.error{background:var(--red);border-color:var(--red);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto}
.pin-key{width:100%;aspect-ratio:1.4;border-radius:12px;font-size:22px;font-weight:600;background:var(--bg-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;transition:background .1s,transform .08s;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.pin-key:hover{background:var(--line)}
.pin-key:active{transform:scale(0.95);background:var(--line)}
.pin-key.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.pin-key.accent:hover{background:var(--accent-ink)}
.pin-key.ghost{background:transparent;border-color:transparent;font-size:14px;color:var(--muted)}
.pin-key.ghost:hover{background:rgba(0,0,0,0.04)}
.pin-error{color:var(--red);font-size:13px;margin-top:12px;min-height:20px}
</style>
</head>
<body>
<div class="pin-screen" id="activate-screen" style="display:none">
  <div class="pin-box">
    <div class="pin-brand">Ledger<span class="dot">.</span></div>
    <div class="pin-sub">Renewal Tracker</div>
    <div class="pin-msg">Enter activation code to set up this device</div>
    <div style="margin:20px 0">
      <input type="password" id="activate-input" placeholder="Activation code" style="width:100%;padding:12px 14px;border:1.5px solid var(--line-2);border-radius:10px;font-size:16px;text-align:center;background:var(--surface);letter-spacing:0.1em">
    </div>
    <button class="pin-key accent" style="width:100%;aspect-ratio:auto;padding:14px;font-size:15px;border-radius:10px;margin-top:4px" onclick="checkActivation()">Activate</button>
    <div class="pin-error" id="activate-error"></div>
  </div>
</div>

<div class="pin-screen" id="pin-screen" style="display:none">
  <div class="pin-box">
    <div class="pin-brand">Ledger<span class="dot">.</span></div>
    <div class="pin-sub">Renewal Tracker</div>
    <div class="pin-msg" id="pin-msg">Enter your PIN to unlock</div>
    <div class="pin-dots" id="pin-dots">
      <div class="dc"></div><div class="dc"></div><div class="dc"></div><div class="dc"></div>
    </div>
    <div class="pin-pad" id="pin-pad">
      <button class="pin-key" data-k="1">1</button>
      <button class="pin-key" data-k="2">2</button>
      <button class="pin-key" data-k="3">3</button>
      <button class="pin-key" data-k="4">4</button>
      <button class="pin-key" data-k="5">5</button>
      <button class="pin-key" data-k="6">6</button>
      <button class="pin-key" data-k="7">7</button>
      <button class="pin-key" data-k="8">8</button>
      <button class="pin-key" data-k="9">9</button>
      <button class="pin-key ghost" data-k="clear">Clear</button>
      <button class="pin-key" data-k="0">0</button>
      <button class="pin-key accent" data-k="ok">✓</button>
    </div>
    <div class="pin-error" id="pin-error"></div>
  </div>
</div>

<div class="app" id="app-main" style="display:none">
  <aside class="sidebar">
    <div class="brand">Ledger<span class="dot">.</span></div>
    <div class="brand-sub">Renewal Tracker</div>
    <nav class="nav">
      <button class="nav-item" data-view="dashboard">Dashboard <span class="badge" id="badge-dashboard" hidden></span></button>
      <div class="nav-section">Records</div>
      <button class="nav-item" data-view="businesses">Businesses <span class="badge" id="badge-businesses" hidden></span></button>
      <button class="nav-item" data-view="employees">Employees <span class="badge" id="badge-employees" hidden></span></button>
      <button class="nav-item" data-view="payments">Payments <span class="badge" id="badge-payments" hidden></span></button>
      <div class="nav-section">System</div>
      <button class="nav-item" data-view="settings">Settings</button>
    </nav>
    <div class="sidebar-footer">All data is stored locally in this browser. Export regularly for backup.</div>
  </aside>
  <main class="content" id="view"></main>
</div>

<div class="overlay" id="overlay"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ACTIVATION GATE
   ========================================================= */
const ACT_KEY='ledger_activated_v1';
const ACT_CODE='Activation@1111';

function checkActivation(){
  const input=document.getElementById('activate-input').value.trim();
  if(input===ACT_CODE){
    localStorage.setItem(ACT_KEY,'1');
    document.getElementById('activate-screen').style.display='none';
    document.getElementById('pin-screen').style.display='';
    initPIN();
  } else {
    document.getElementById('activate-error').textContent='Invalid activation code';
    document.getElementById('activate-input').value='';
    document.getElementById('activate-input').focus();
  }
}
// Allow Enter key on activation input
document.getElementById('activate-input').addEventListener('keydown',e=>{
  if(e.key==='Enter') checkActivation();
});

/* =========================================================
   PIN LOCK
   ========================================================= */
const PIN_KEY='ledger_pin_v1';
let pinBuffer=[];
let pinMode='unlock'; // 'setup', 'confirm', 'unlock', 'change', 'change-confirm'
let pinSetupValue='';

function initPIN(){
  const activated=localStorage.getItem(ACT_KEY);
  const storedPin=localStorage.getItem(PIN_KEY);

  if(!activated && !storedPin){
    // New device, never activated — show activation screen
    document.getElementById('activate-screen').style.display='';
    document.getElementById('pin-screen').style.display='none';
    document.getElementById('activate-input').focus();
    return;
  }

  // Already activated (or has a PIN from before the activation feature)
  document.getElementById('activate-screen').style.display='none';
  document.getElementById('pin-screen').style.display='';

  if(!storedPin){
    pinMode='setup';
    document.getElementById('pin-msg').textContent='Create a 4-digit PIN to secure your app';
  } else {
    pinMode='unlock';
    document.getElementById('pin-msg').textContent='Enter your PIN to unlock';
  }
  pinBuffer=[];
  updateDots();
  document.getElementById('pin-error').textContent='';
}

function handlePinKey(k){
  const errEl=document.getElementById('pin-error');
  errEl.textContent='';

  if(k==='clear'){
    pinBuffer=[];
    updateDots();
    return;
  }

  if(k==='ok'){
    const pin=pinBuffer.join('');
    if(pin.length<4){errEl.textContent='Enter 4 digits';return}

    if(pinMode==='setup'){
      pinSetupValue=pin;
      pinMode='confirm';
      document.getElementById('pin-msg').textContent='Confirm your PIN — enter it again';
      pinBuffer=[];updateDots();
      return;
    }
    if(pinMode==='confirm'){
      if(pin===pinSetupValue){
        localStorage.setItem(PIN_KEY,pin);
        unlockApp();
        toast('PIN created');
      } else {
        showPinError('PINs don\'t match — try again');
        pinMode='setup';
        document.getElementById('pin-msg').textContent='Create a 4-digit PIN to secure your app';
        pinBuffer=[];updateDots();
      }
      return;
    }
    if(pinMode==='unlock'){
      const stored=localStorage.getItem(PIN_KEY);
      if(pin===stored){
        unlockApp();
      } else {
        showPinError('Wrong PIN');
        pinBuffer=[];updateDots();
      }
      return;
    }
    if(pinMode==='change'){
      pinSetupValue=pin;
      pinMode='change-confirm';
      document.getElementById('pin-msg').textContent='Confirm your new PIN';
      pinBuffer=[];updateDots();
      return;
    }
    if(pinMode==='change-confirm'){
      if(pin===pinSetupValue){
        localStorage.setItem(PIN_KEY,pin);
        unlockApp();
        toast('PIN changed');
      } else {
        showPinError('PINs don\'t match — try again');
        pinMode='change';
        document.getElementById('pin-msg').textContent='Enter a new 4-digit PIN';
        pinBuffer=[];updateDots();
      }
      return;
    }
    return;
  }

  // digit
  if(pinBuffer.length<4){
    pinBuffer.push(k);
    updateDots();
  }
}

function updateDots(){
  const dots=document.querySelectorAll('#pin-dots .dc');
  dots.forEach((d,i)=>{
    d.classList.toggle('filled',i<pinBuffer.length);
    d.classList.remove('error');
  });
}

function showPinError(msg){
  document.getElementById('pin-error').textContent=msg;
  const dots=document.querySelectorAll('#pin-dots .dc');
  dots.forEach(d=>{d.classList.add('error');d.classList.remove('filled')});
  setTimeout(()=>{dots.forEach(d=>d.classList.remove('error'))},500);
  pinBuffer=[];
}

function unlockApp(){
  document.getElementById('pin-screen').style.display='none';
  document.getElementById('app-main').style.display='';
}

function showPinScreen(mode){
  pinMode=mode||'unlock';
  pinBuffer=[];
  pinSetupValue='';
  const msg=mode==='change'?'Enter a new 4-digit PIN':
            mode==='setup'?'Create a 4-digit PIN to secure your app':
            'Enter your PIN to unlock';
  document.getElementById('pin-msg').textContent=msg;
  document.getElementById('pin-error').textContent='';
  updateDots();
  document.getElementById('pin-screen').style.display='';
  document.getElementById('app-main').style.display='none';
}

// Bind PIN pad
document.getElementById('pin-pad').addEventListener('click',e=>{
  const btn=e.target.closest('[data-k]');
  if(btn) handlePinKey(btn.dataset.k);
});

// Keyboard support
document.addEventListener('keydown',e=>{
  if(document.getElementById('pin-screen').style.display==='none') return;
  if(e.key>='0'&&e.key<='9') handlePinKey(e.key);
  else if(e.key==='Backspace'){pinBuffer.pop();updateDots()}
  else if(e.key==='Enter') handlePinKey('ok');
});

const STORE_KEY='ledger_renewal_v3';
const FILE_DB='ledger_files_v1';
const defaultState={businesses:[],employees:[],payments:[]};
let state=load();

function load(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw){
      // Migration from v2 or v1
      const v2=localStorage.getItem('ledger_renewal_v2');
      const v1=localStorage.getItem('ledger_renewal_v1');
      const src=v2?JSON.parse(v2):(v1?JSON.parse(v1):null);
      if(src){
        return {businesses:src.businesses||[],employees:src.employees||[],payments:src.payments||[]};
      }
      return JSON.parse(JSON.stringify(defaultState));
    }
    const parsed=JSON.parse(raw);
    return {...defaultState,...parsed};
  }catch(e){console.error(e);return JSON.parse(JSON.stringify(defaultState))}
}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

let _db;
function openFileDB(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const req=indexedDB.open(FILE_DB,1);
    req.onupgradeneeded=()=>req.result.createObjectStore('files');
    req.onsuccess=()=>{_db=req.result;res(_db)};
    req.onerror=()=>rej(req.error);
  });
}
function putFile(key,blob){return openFileDB().then(db=>new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(blob,key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)}))}
function getFile(key){return openFileDB().then(db=>new Promise((res,rej)=>{const tx=db.transaction('files','readonly');const req=tx.objectStore('files').get(key);req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)}))}
function deleteFileFromDB(key){return openFileDB().then(db=>new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)}))}

/* =========================================================
   DATE / FORMAT HELPERS
   ========================================================= */
function todayISO(){const d=new Date();d.setHours(0,0,0,0);return d.toISOString().slice(0,10)}
function parseDate(s){if(!s) return null;const d=new Date(s+'T00:00:00');return isNaN(d)?null:d}
function fmtDate(s){const d=parseDate(s);if(!d) return '—';return d.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'})}
function fmtDateLong(s){const d=parseDate(s);if(!d) return '—';return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}
function fmtDateAr(s){const d=parseDate(s);if(!d) return '—';return d.toLocaleDateString('ar-BH',{day:'numeric',month:'long',year:'numeric'})}
function fmtDateNum(s){const d=parseDate(s);if(!d) return '—';const dd=String(d.getDate()).padStart(2,'0');const mm=String(d.getMonth()+1).padStart(2,'0');return dd+'/'+mm+'/'+d.getFullYear()}
function daysUntil(s){const d=parseDate(s);if(!d) return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/86400000)}
function addPeriod(iso,period){
  const d=parseDate(iso);if(!d) return iso;
  if(period==='monthly') d.setMonth(d.getMonth()+1);
  else if(period==='biannual') d.setMonth(d.getMonth()+6);
  else if(period==='yearly') d.setFullYear(d.getFullYear()+1);
  else if(period==='2years') d.setFullYear(d.getFullYear()+2);
  else if(period==='3years') d.setFullYear(d.getFullYear()+3);
  return d.toISOString().slice(0,10);
}
function statusFor(days){
  if(days===null||days===undefined) return {key:'gray',label:'No date'};
  if(days<0) return {key:'red',label:'Overdue '+Math.abs(days)+'d'};
  if(days<=30) return {key:'red',label:days+'d left'};
  if(days<=60) return {key:'amber',label:days+'d left'};
  if(days<=90) return {key:'yellow',label:days+'d left'};
  return {key:'green',label:days+'d left'};
}
function labelPeriod(p){return ({monthly:'Monthly',biannual:'Every 6 months',yearly:'Yearly','2years':'Every 2 years','3years':'Every 3 years',once:'One-time'})[p]||p||'—'}
function fmtFileSize(b){if(!b) return '';if(b<1024) return b+' B';if(b<1024*1024) return (b/1024).toFixed(1)+' KB';return (b/1024/1024).toFixed(2)+' MB'}

/* Address composition */
function composeAddr(b){
  const p=[];
  if(b.addrBuilding) p.push('Building '+b.addrBuilding);
  if(b.addrRoad) p.push('Road '+b.addrRoad);
  if(b.addrBlock) p.push('Block '+b.addrBlock);
  if(b.addrCity) p.push(b.addrCity);
  if(b.addrCountry) p.push(b.addrCountry);
  return p.join(', ')||b.address||'';
}
function composeAddrAr(b){
  const p=[];
  if(b.addrBuilding) p.push('مبنى '+b.addrBuilding);
  if(b.addrRoad) p.push('طريق '+b.addrRoad);
  if(b.addrBlock) p.push('مجمع '+b.addrBlock);
  if(b.addrCityAr) p.push(b.addrCityAr);
  if(b.addrCountryAr) p.push(b.addrCountryAr);
  return p.join('، ')||b.addressAr||'';
}

/* Position & nationality presets with Arabic */
const POS_PRESETS=[
  {en:'Tailor',ar:'خياط'},
  {en:'Hairdresser',ar:'مصففة شعر'}
];
const NAT_PRESETS=[
  {en:'Indian',ar:'هندي'},
  {en:'Filipino',ar:'فلبيني'},
  {en:'Bangladeshi',ar:'بنغلاديشي'},
  {en:'Pakistani',ar:'باكستاني'},
  {en:'Nepali',ar:'نيبالي'}
];
function posArFromEn(v){const m=POS_PRESETS.find(p=>p.en.toLowerCase()===v.toLowerCase());return m?m.ar:''}
function natArFromEn(v){const m=NAT_PRESETS.find(p=>p.en.toLowerCase()===v.toLowerCase());return m?m.ar:''}
function durationBetween(start,end){
  const s=parseDate(start),e=parseDate(end);
  if(!s||!e) return '';
  let months=(e.getFullYear()-s.getFullYear())*12+(e.getMonth()-s.getMonth());
  if(e.getDate()<s.getDate()) months--;
  if(months<0) return '';
  const y=Math.floor(months/12),m=months%12;
  const yPart=y?y+' year'+(y!==1?'s':''):'';
  const mPart=m?m+' month'+(m!==1?'s':''):'';
  return [yPart,mPart].filter(Boolean).join(' ');
}
function durationBetweenAr(start,end){
  const s=parseDate(start),e=parseDate(end);
  if(!s||!e) return '';
  let months=(e.getFullYear()-s.getFullYear())*12+(e.getMonth()-s.getMonth());
  if(e.getDate()<s.getDate()) months--;
  if(months<0) return '';
  const y=Math.floor(months/12),m=months%12;
  const arDigits=n=>String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
  const yPart=y?(y===1?'سنة':y===2?'سنتان':arDigits(y)+' سنوات'):'';
  const mPart=m?(m===1?'شهر':m===2?'شهران':arDigits(m)+' أشهر'):'';
  return [yPart,mPart].filter(Boolean).join(' و');
}

async function attachFile(recordType,recordId,fieldName,file){
  if(!file) return;
  if(file.size>20*1024*1024){if(!confirm('File is larger than 20 MB. Continue?')) return}
  const key=recordType+'-'+recordId+'-'+fieldName+'-'+uid();
  await putFile(key,file);
  const coll=recordType==='biz'?state.businesses:state.employees;
  const rec=coll.find(r=>r.id===recordId);
  if(!rec) return;
  if(rec[fieldName]&&rec[fieldName].key){try{await deleteFileFromDB(rec[fieldName].key)}catch(e){}}
  rec[fieldName]={key,name:file.name,size:file.size,type:file.type,uploadedAt:todayISO()};
  save();refreshFileSection(recordType,recordId,fieldName);
  toast('File attached');render();
}
async function viewAttachment(recordType,recordId,fieldName){
  const coll=recordType==='biz'?state.businesses:state.employees;
  const rec=coll.find(r=>r.id===recordId);
  if(!rec||!rec[fieldName]) return;
  const blob=await getFile(rec[fieldName].key);
  if(!blob){toast('File not found');return}
  const url=URL.createObjectURL(blob);
  window.open(url,'_blank');
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
async function downloadAttachment(recordType,recordId,fieldName){
  const coll=recordType==='biz'?state.businesses:state.employees;
  const rec=coll.find(r=>r.id===recordId);
  if(!rec||!rec[fieldName]) return;
  const blob=await getFile(rec[fieldName].key);
  if(!blob){toast('File not found');return}
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=rec[fieldName].name;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function removeAttachment(recordType,recordId,fieldName){
  if(!confirm('Remove this file?')) return;
  const coll=recordType==='biz'?state.businesses:state.employees;
  const rec=coll.find(r=>r.id===recordId);
  if(!rec||!rec[fieldName]) return;
  try{await deleteFileFromDB(rec[fieldName].key)}catch(e){}
  delete rec[fieldName];save();refreshFileSection(recordType,recordId,fieldName);
  toast('File removed');render();
}
function renderFileSection(recordType,recordId,fieldName,record){
  const file=record[fieldName];
  if(file){
    return `<div class="file-card">
      <div class="file-icon">PDF</div>
      <div class="file-info">
        <div class="file-name">${escapeHTML(file.name)}</div>

      </div>

        <button type="button" class="btn btn-sm" onclick="viewAttachment('${recordType}','${recordId}','${fieldName}')">Open</button>
        <button type="button" class="btn btn-sm" onclick="downloadAttachment('${recordType}','${recordId}','${fieldName}')">Download</button>
        <button type="button" class="btn btn-sm btn-ghost btn-danger" onclick="removeAttachment('${recordType}','${recordId}','${fieldName}')">Remove</button>

function renderUrgentItem(i){

}

function renderEmployees(){
  const search=filters.search.toLowerCase();
  const rows=state.employees
    .filter(e=>filters.biz==='all'||e.businessId===filters.biz)
    .filter(e=>!search||e.name.toLowerCase().includes(search)||(e.cprNumber||'').toLowerCase().includes(search))
    .sort((a,b)=>{
      const da=Math.min(daysUntil(a.cprExpiry)??1e9,daysUntil(a.visaExpiry)??1e9,daysUntil(a.medicalNext)??1e9);
      const db=Math.min(daysUntil(b.cprExpiry)??1e9,daysUntil(b.visaExpiry)??1e9,daysUntil(b.medicalNext)??1e9);
      return da-db;
    });
  const bizChips=`<button class="chip ${filters.biz==='all'?'active':''}" data-biz-filter="all">All businesses</button>`+
    state.businesses.map(b=>`<button class="chip ${filters.biz===b.id?'active':''}" data-biz-filter="${b.id}">${escapeHTML(b.name)}</button>`).join('');
  return `
    <div class="page-head">

        <thead><tr><th>Employee</th><th>Business</th><th>Position</th><th>CPR</th><th>Visa</th><th>Medical</th><th>Files</th><th></th></tr></thead>

/* =========================================================
   CONTRACT FORM & GENERATION
   ========================================================= */
function openContractForm(empId,contractId){
  const e=state.employees.find(x=>x.id===empId);
  if(!e) return;
  const biz=state.businesses.find(b=>b.id===e.businessId);
  if(!biz){toast('Employee must be linked to a business');return}
  const existing=(e.contracts||[]).find(c=>c.id===contractId);
  const c=existing||{
    startDate:todayISO(),
    contractDuration:'2years',
    endDate:addPeriod(todayISO(),'2years'),
    probationMonths:3,
    position:e.position||'',
    positionAr:e.positionAr||'',
    jobDuties:'',
    hoursPerDay:8,
    daysPerWeek:6,
    restDay:'Friday',
    basicSalary:'',
    allowanceAmount:'',
    allowanceType:'Living allowance',
    allowanceTypeAr:'بدل معيشة',
    annualLeaveDays:30,
    noticeDays:30,
    placeOfWork:composeAddr(biz)||''
  };
  const isEdit=!!existing;
  openModal({
    title:isEdit?'Edit contract':'Generate employment contract',
    wide:true,
    body:`
      <div style="background:var(--accent-soft);padding:12px 14px;border-radius:8px;font-size:13px;color:var(--ink-2);margin-bottom:18px;line-height:1.5">
        <strong>For:</strong> ${escapeHTML(e.name)} · <strong>At:</strong> ${escapeHTML(biz.name)}<br>
        Fields below will fill in your bilingual employment contract. Confidentiality and governing law clauses are included automatically.
      </div>

      <div class="form-section" style="margin-top:0;padding-top:0;border:0">Contract dates & duration</div>
      <div class="form-grid">
        <div class="form-row"><label class="form-label">Start date</label><input type="date" id="c-start" value="${c.startDate}"></div>
        <div class="form-row"><label class="form-label">Contract duration</label><select id="c-dur">
          ${['biannual','yearly','2years','3years'].map(p=>`<option value="${p}" ${c.contractDuration===p?'selected':''}>${labelPeriod(p)}</option>`).join('')}
        </select></div>
        <div class="form-row"><label class="form-label">Probation (months)</label><input type="number" id="c-prob" min="0" max="6" value="${c.probationMonths}"></div>
        <div class="form-row"><label class="form-label">Notice period (days)</label><input type="number" id="c-notice" min="1" value="${c.noticeDays}"></div>
      </div>

      <div class="form-section">Position</div>
      <div class="form-grid">
        <div class="form-row"><label class="form-label">Position (English)</label><input type="text" id="c-pos" value="${escapeHTML(c.position)}" placeholder="e.g. Hairdresser"></div>
        <div class="form-row"><label class="form-label">Position (Arabic)</label><input type="text" id="c-posar" dir="rtl" value="${escapeHTML(c.positionAr)}" placeholder="مثال: مصففة شعر"></div>
      </div>
      <div class="form-row"><label class="form-label">Job duties (optional, free text)</label><textarea id="c-duties" placeholder="Specific responsibilities. Leave empty to use the default duty clause.">${escapeHTML(c.jobDuties||'')}</textarea></div>
      <div class="form-row"><label class="form-label">Place of work</label><input type="text" id="c-place" value="${escapeHTML(c.placeOfWork||'')}" placeholder="e.g. Riffa branch"></div>

      <div class="form-section">Working hours</div>
      <div class="form-grid">
        <div class="form-row"><label class="form-label">Hours per day</label><input type="number" id="c-hpd" min="1" max="12" value="${c.hoursPerDay}"></div>
        <div class="form-row"><label class="form-label">Days per week</label><input type="number" id="c-dpw" min="1" max="7" value="${c.daysPerWeek}"></div>
        <div class="form-row"><label class="form-label">Weekly rest day</label><input type="text" id="c-rest" value="${escapeHTML(c.restDay)}" placeholder="Friday"></div>
      </div>

      <div class="form-section">Compensation</div>
      <div class="form-grid">
        <div class="form-row"><label class="form-label">Basic salary (BHD/month)</label><input type="number" id="c-sal" step="0.001" value="${c.basicSalary}"></div>
        <div class="form-row"><label class="form-label">Allowance (BHD/month)</label><input type="number" id="c-allow" step="0.001" value="${c.allowanceAmount}"></div>
        <div class="form-row"><label class="form-label">Allowance type (EN)</label><input type="text" id="c-allowtype" value="${escapeHTML(c.allowanceType)}" placeholder="Living / Housing / Transport allowance"></div>
        <div class="form-row"><label class="form-label">Allowance type (AR)</label><input type="text" id="c-allowtypear" dir="rtl" value="${escapeHTML(c.allowanceTypeAr)}" placeholder="بدل معيشة"></div>
      </div>

      <div class="form-section">Leave</div>
      <div class="form-row"><label class="form-label">Annual leave days</label><input type="number" id="c-leave" min="0" value="${c.annualLeaveDays}"><div class="form-hint">Bahraini law minimum: 30 calendar days per year after one year of service.</div></div>
    `,
    actions:[
      isEdit?{label:'Delete contract',cls:'btn-danger btn-ghost',handler:()=>{deleteContract(empId,contractId);closeModal()}}:null,
      {label:'Cancel',cls:'btn-ghost',handler:closeModal},
      {label:'Save & Preview',cls:'btn-accent',handler:()=>{
        const startDate=val('c-start');
        const contractDuration=val('c-dur');
        const endDate=addPeriod(startDate,contractDuration);
        const data={
          id:contractId||uid(),
          startDate,contractDuration,endDate,
          probationMonths:Number(val('c-prob'))||0,noticeDays:Number(val('c-notice'))||30,
          position:val('c-pos'),positionAr:val('c-posar'),
          jobDuties:val('c-duties'),placeOfWork:val('c-place'),
          hoursPerDay:Number(val('c-hpd'))||8,daysPerWeek:Number(val('c-dpw'))||6,restDay:val('c-rest'),
          basicSalary:val('c-sal'),allowanceAmount:val('c-allow'),
          allowanceType:val('c-allowtype'),allowanceTypeAr:val('c-allowtypear'),
          annualLeaveDays:Number(val('c-leave'))||30,
          createdAt:existing?existing.createdAt:todayISO(),
          updatedAt:todayISO()
        };
        if(!data.startDate) return toast('Start date is required');
        if(!data.position) return toast('Position is required');
        if(!data.basicSalary) return toast('Basic salary is required');
        e.contracts=e.contracts||[];
        const idx=e.contracts.findIndex(x=>x.id===data.id);
        if(idx>=0) e.contracts[idx]=data; else e.contracts.push(data);
        save();closeModal();
        setTimeout(()=>openContractPreview(empId,data.id),100);
        toast(isEdit?'Contract updated':'Contract generated');
      }}
    ].filter(Boolean)
  });
}

function deleteContract(empId,contractId){
  if(!confirm('Delete this contract record? You can regenerate from scratch later.')) return;
  const e=state.employees.find(x=>x.id===empId);
  if(!e) return;
  e.contracts=(e.contracts||[]).filter(c=>c.id!==contractId);
  save();render();toast('Contract deleted');
}

function openContractPreview(empId,contractId){
  const e=state.employees.find(x=>x.id===empId);
  if(!e) return;
  const c=(e.contracts||[]).find(x=>x.id===contractId);
  if(!c) return;
  const biz=state.businesses.find(b=>b.id===e.businessId);
  if(!biz){toast('Linked business not found');return}
  const html=generateContractHTML(c,e,biz);
  previewDocument(html);
}

/* Inline document preview — no pop-ups needed */
function previewDocument(html){
  // Remove internal print bar from the HTML since we have our own toolbar
  html=html.replace(/<div class="print-bar">[\s\S]*?<\/div>/,'');

  const preview=document.createElement('div');
  preview.id='doc-preview';
  preview.style.cssText='position:fixed;inset:0;z-index:100;background:#f0eee8;display:flex;flex-direction:column;';

  const bar=document.createElement('div');
  bar.style.cssText='background:#1c1c1a;color:#f5f2ec;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;gap:12px;';
  bar.innerHTML=`
    <button style="background:#f5f2ec;color:#1c1c1a;border:0;padding:8px 18px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;font-family:var(--sans)" onclick="closeDocPreview()">← Back to app</button>
    <button style="background:#0d6d56;color:#fff;border:0;padding:8px 18px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;font-family:var(--sans)" onclick="printDocPreview()">Print / Save as PDF</button>
  `;

  const iframe=document.createElement('iframe');
  iframe.id='doc-preview-frame';
  iframe.style.cssText='flex:1;border:0;width:100%;background:#fff;';

  preview.appendChild(bar);
  preview.appendChild(iframe);
  document.body.appendChild(preview);

  const doc=iframe.contentDocument||iframe.contentWindow.document;
  doc.open();doc.write(html);doc.close();
}
function closeDocPreview(){
  const el=document.getElementById('doc-preview');
  if(el) el.remove();
}
function printDocPreview(){
  const frame=document.getElementById('doc-preview-frame');
  if(frame) frame.contentWindow.print();
}

function generateContractHTML(c,e,b){
  const fallback=(x,y)=>x&&x.trim()?x:(y||'');
  const empName=e.name||'';
  const empNameAr=fallback(e.nameAr,empName);
  const bizName=b.name||'';
  const bizNameAr=fallback(b.nameAr,bizName);
  const bizAddr=composeAddr(b);
  const bizAddrAr=fallback(composeAddrAr(b),bizAddr);
  const pos=c.position||e.position||'';
  const posAr=fallback(c.positionAr,pos);
  const passport=e.passportNumber||'';
  const cpr=e.cprNumber||'';
  const nat=e.nationality||'';
  const duration=durationBetween(c.startDate,c.endDate);
  const durationAr=durationBetweenAr(c.startDate,c.endDate);
  const startEN=fmtDateLong(c.startDate),endEN=fmtDateLong(c.endDate);
  const startAR=fmtDateAr(c.startDate),endAR=fmtDateAr(c.endDate);
  const today=fmtDateLong(c.createdAt||todayISO());
  const todayAr=fmtDateAr(c.createdAt||todayISO());

  const sections=[];
  let n=1;

  // 1. Job duties
  sections.push({
    n:n++,
    titleEN:'Job Duties',titleAR:'مهام الوظيفة',
    en: c.jobDuties && c.jobDuties.trim()
      ? c.jobDuties
      : `The Second Party agrees to perform the duties of ${pos} as assigned by the First Party, and to follow all company policies, internal regulations, and applicable Bahraini labour law.`,
    ar: c.jobDuties && c.jobDuties.trim()
      ? c.jobDuties
      : `يوافق الطرف الثاني على أداء مهام ${posAr} كما يحددها الطرف الأول، والالتزام بجميع سياسات الشركة واللوائح الداخلية وقانون العمل البحريني المعمول به.`
  });

  // 2. Working hours
  let hoursEN=`Standard working hours are ${c.hoursPerDay} hours per day, ${c.daysPerWeek} days per week. The weekly rest day is ${c.restDay}.`;
  let hoursAR=`ساعات العمل المعتادة هي ${c.hoursPerDay} ساعات في اليوم، ${c.daysPerWeek} أيام في الأسبوع. يوم الراحة الأسبوعي هو ${c.restDay}.`;
  sections.push({n:n++,titleEN:'Working Hours',titleAR:'ساعات العمل',en:hoursEN,ar:hoursAR});

  // 3. Salary
  const salN=Number(c.basicSalary)||0,allN=Number(c.allowanceAmount)||0;
  sections.push({
    n:n++,
    titleEN:'Salary and Benefits',titleAR:'الراتب والمزايا',
    en:`The Second Party shall receive a monthly basic salary of BHD ${salN.toFixed(3)}${allN?`, and a ${c.allowanceType.toLowerCase()} of BHD ${allN.toFixed(3)}`:''}, along with any other agreed benefits.`,
    ar:`يتقاضى الطرف الثاني راتباً أساسياً شهرياً قدره ${salN.toFixed(3)} دينار بحريني${allN?`، و${c.allowanceTypeAr} قدره ${allN.toFixed(3)} دينار بحريني`:''}، بالإضافة إلى أي مزايا أخرى متفق عليها.`
  });

  // 4. Annual leave
  sections.push({
    n:n++,
    titleEN:'Annual Leave',titleAR:'الإجازة السنوية',
    en:`The Second Party is entitled to ${c.annualLeaveDays} calendar days of paid annual leave per year after completing one year of service, in accordance with Bahraini Labour Law.`,
    ar:`يستحق الطرف الثاني ${c.annualLeaveDays} يوماً تقويمياً من الإجازة السنوية مدفوعة الأجر سنوياً بعد إكمال سنة من الخدمة، وفقاً لقانون العمل البحريني.`
  });

  // 5. Probation
  if(c.probationMonths>0){
    sections.push({
      n:n++,
      titleEN:'Probation Period',titleAR:'فترة التجربة',
      en:`The Second Party shall serve a probation period of ${c.probationMonths} month${c.probationMonths!==1?'s':''} from the contract start date. During this period, either party may terminate the contract with one day's written notice.`,
      ar:`يخضع الطرف الثاني لفترة تجربة قدرها ${c.probationMonths} ${c.probationMonths===1?'شهر':c.probationMonths===2?'شهران':'أشهر'} من تاريخ بدء العقد. خلال هذه الفترة، يحق لأي من الطرفين إنهاء العقد بإشعار كتابي مدته يوم واحد.`
    });
  }

  // 6. Termination & non-renewal
  sections.push({
    n:n++,
    titleEN:'Termination and Non-Renewal',titleAR:'إنهاء العقد وعدم التجديد',
    en:`This contract will automatically end on ${endEN} unless renewed by mutual agreement. Either party may terminate this contract by providing ${c.noticeDays} days' written notice. The First Party may terminate employment without notice for just cause as provided under Bahraini Labour Law. If either party does not intend to renew, written notice must be provided at least ${c.noticeDays} days before the contract end date.`,
    ar:`ينتهي هذا العقد تلقائياً في ${endAR} ما لم يتم تجديده باتفاق الطرفين. يحق لأي من الطرفين إنهاء هذا العقد بإشعار كتابي مدته ${c.noticeDays} يوماً. يجوز للطرف الأول إنهاء العمل دون إشعار لأسباب مشروعة وفقاً لقانون العمل البحريني. إذا لم ينوِ أي من الطرفين تجديد العقد، يجب تقديم إشعار كتابي قبل ${c.noticeDays} يوماً على الأقل من تاريخ انتهاء العقد.`

  });

  // 7. Governing law
  sections.push({
    n:n++,
    titleEN:'Governing Law and Jurisdiction',titleAR:'القانون المعمول به والاختصاص القضائي',
    en:`This contract shall be governed by and construed in accordance with the Labour Law for the Private Sector of the Kingdom of Bahrain. Any disputes arising out of or in connection with this contract shall be referred to the competent courts of the Kingdom of Bahrain.`,
    ar:`يخضع هذا العقد ويفسر وفقاً لقانون العمل في القطاع الأهلي لمملكة البحرين. تحال أي نزاعات تنشأ عن هذا العقد أو ترتبط به إلى المحاكم المختصة في مملكة البحرين.`
  });

  const sectionsHTML=sections.map(s=>`
    <div class="section">
      <div class="bilingual">
        <div class="col en">
          <div class="sec-title">${s.n}. ${s.titleEN}</div>
          <div class="sec-body">${escapeHTML(s.en)}</div>
        </div>
        <div class="col ar">
          <div class="sec-title">${s.n}. ${s.titleAR}</div>
          <div class="sec-body">${escapeHTML(s.ar)}</div>
        </div>
      </div>
    </div>
  `).join('');

  const docTitle='Employment Contract — '+empName;

  return `<!DOCTYPE html>

  .print-bar button { background: #f5f2ec; color: #1c1c1a; border: 0; padding: 6px 14px; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; }
  .print-bar button:hover { background: #fff; }

        <span class="ar">توقيع الطرف الأول</span>

    <div class="sig">
      <div class="sig-line">

        <span class="ar">توقيع الطرف الثاني</span>

function kindAr(k){

}
function openReport(){
  const items=allItems();
  const overdue=items.filter(i=>i.days!==null&&i.days<0);
  const upcoming=items.filter(i=>i.days!==null&&i.days>=0&&i.days<=20);
  const today=fmtDateLong(todayISO());
  const todayAr=fmtDateAr(todayISO());
  const bizNames=state.businesses.map(b=>b.name).join('  ·  ');

  function renderRows(rows){
    return rows.map((r,i)=>{
      const isOverdue=r.days<0;
      const daysText=isOverdue?Math.abs(r.days)+' days overdue':r.days+' days left';
      const daysTextAr=isOverdue?Math.abs(r.days)+' يوم متأخر':r.days+' يوم متبقي';

      return `<tr class="row-${urgency}">
        <td class="c-num">${i+1}</td>

        <td class="c-name">${escapeHTML(r.title)}</td>
        <td class="c-date">${fmtDate(r.date)}</td>
        <td class="c-status">
          <div class="badge ${urgency}">${daysText}</div>
          <div class="badge-ar">${daysTextAr}</div>
        </td>
      </tr>`;
    }).join('');
  }

  const allRows=[...overdue,...upcoming];

  const html=`<!DOCTYPE html>
<html lang="en">
<head>

<title>Renewal Report</title>
<style>
  @page { size: A4; margin: 0 }
  * { box-sizing: border-box; margin: 0; padding: 0 }

  .rpt-header { text-align: center; padding-bottom: 12px; margin-bottom: 16px; border-bottom: 2.5px solid #1a1a1a }
  .rpt-header h1 { font-size: 18pt; font-weight: 800 }
  .rpt-header .ar-title { font-size: 17pt; margin-top: 4px; font-weight: 700 }
  .rpt-header .date-row { font-size: 9.5pt; color: #555; margin-top: 8px; display: flex; justify-content: center; gap: 16px }
  .rpt-header .biz { font-size: 8pt; color: #999; margin-top: 4px }

  /* ---- Summary ---- */
  .rpt-summary { display: flex; gap: 14px; margin-bottom: 18px }
  .s-card { flex: 1; padding: 16px 12px; border-radius: 12px; text-align: center }
  .s-card.red { background: #fef0ee; border: 1.5px solid #e8a9a4 }
  .s-card.amber { background: #fef8eb; border: 1.5px solid #e0c880 }
  .s-card .s-num { font-size: 36pt; font-weight: 800; line-height: 1 }
  .s-card.red .s-num { color: #b3261e }
  .s-card.amber .s-num { color: #a86b00 }
  .s-card .s-en { font-size: 9pt; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #555; margin-top: 8px }
  .s-card .s-ar { font-size: 11pt; color: #777; margin-top: 4px }

  /* ---- Table ---- */
  .tbl-head { background: #1a1a1a; color: #fff; padding: 10px 16px; border-radius: 10px 10px 0 0; display: flex; justify-content: space-between; align-items: center }
  .tbl-head .en { font-size: 10.5pt; font-weight: 700 }
  .tbl-head .ar { font-size: 12pt; font-weight: 700; color: #eee }
  .rpt-table { width: 100%; border-collapse: collapse }
  .rpt-table th {
    font-size: 7.5pt; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: #999; padding: 8px 10px; border-bottom: 2px solid #ddd; background: #f8f6f1; text-align: left
  }
  .rpt-table td { padding: 9px 10px; border-bottom: 1px solid #f0ece4; vertical-align: middle }
  .rpt-table tr:last-child td { border-bottom: 0 }
  .row-overdue { background: #fff5f4 }
  .row-urgent { background: #fffcf2 }

  .c-num { width: 28px; color: #ccc; font-size: 9pt; font-weight: 600 }
  .c-type { width: 130px }
  .c-type .en { font-size: 9pt; font-weight: 600; color: #444 }
  .c-type .ar { font-size: 10pt; color: #666; margin-top: 2px; text-align: right }
  .c-name { font-size: 10pt; font-weight: 700 }
  .c-date { font-size: 9.5pt; font-variant-numeric: tabular-nums; white-space: nowrap; color: #333 }
  .c-status { width: 135px }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 99px;
    font-size: 8.5pt; font-weight: 700; white-space: nowrap
  }
  .badge.overdue { background: #fbe9e7; color: #b3261e }
  .badge.urgent { background: #fbeed1; color: #a86b00 }
  .badge.soon { background: #f7f0d3; color: #8a7414 }
  .badge.normal { background: #e6efe2; color: #3a6b3a }
  .badge-ar { font-size: 9.5pt; color: #888; margin-top: 4px; text-align: right }

  /* ---- Footer ---- */
  .rpt-footer { margin-top: 18px; padding-top: 10px; border-top: 1.5px solid #e0dbd0; display: flex; justify-content: space-between; align-items: center; font-size: 8.5pt; color: #aaa }
  .rpt-footer .ar { font-size: 9.5pt; text-align: right }

  /* ---- Empty ---- */
  .all-clear { text-align: center; padding: 50px 20px }
  .all-clear h2 { font-size: 18pt; color: #3a6b3a }
  .all-clear p { font-size: 11pt; color: #888; margin-top: 6px }
  .all-clear .ar { font-size: 13pt; color: #999; margin-top: 8px }

  @media print {
    body { background: #fff; padding: 0 }
    .page { box-shadow: none; padding: 14mm 16mm; max-width: none; margin: 0 }
  }
</style>
</head>
<body>
<div class="page">

  <div class="rpt-header">
    <h1>Renewal & Payment Report</h1>
    <div class="ar-title">تقرير التجديدات والمدفوعات</div>
    <div class="date-row">
      <span>${today}</span>
      <span>·</span>
      <span class="ar" style="display:inline">${todayAr}</span>
    </div>
    <div class="biz">${escapeHTML(bizNames)}</div>
  </div>

  <div class="rpt-summary">
    <div class="s-card red">
      <div class="s-num">${overdue.length}</div>
      <div class="s-en">Overdue</div>
      <div class="ar s-ar">متأخر</div>
    </div>
    <div class="s-card amber">
      <div class="s-num">${upcoming.length}</div>
      <div class="s-en">Due within 20 days</div>
      <div class="ar s-ar">مستحق خلال ٢٠ يوم</div>
    </div>
  </div>

  ${allRows.length?`
    <div class="tbl-head">
      <span class="en">Items Requiring Action</span>
      <span class="ar">العناصر التي تتطلب إجراء</span>
    </div>
    <table class="rpt-table">
      <thead><tr>
        <th>#</th>
        <th>Type / النوع</th>
        <th>Name / الاسم</th>
        <th>Due / التاريخ</th>
        <th>Status / الحالة</th>
      </tr></thead>
      <tbody>${renderRows(allRows)}</tbody>
    </table>
  `:`
    <div class="all-clear">
      <h2>✓ All Clear</h2>
      <p>No overdue or upcoming items in the next 20 days.</p>
      <div class="ar">لا توجد عناصر متأخرة أو مستحقة خلال ٢٠ يوماً القادمة ✓</div>
    </div>
  `}

  <div class="rpt-footer">
    <span>${state.businesses.length} businesses · ${state.employees.length} employees · ${state.payments.length} payments</span>
    <span class="ar">${state.businesses.length} منشآت · ${state.employees.length} موظفين · ${state.payments.length} مدفوعات</span>
  </div>

</div>
</body>
</html>`;

  previewDocument(html);
}

/* =========================================================
   PAYMENTS
   ========================================================= */
function renderPayments(){
  const search=filters.search.toLowerCase();
  const rows=state.payments
    .filter(p=>filters.biz==='all'||p.businessId===filters.biz)
    .filter(p=>!search||p.name.toLowerCase().includes(search))
    .sort((a,b)=>(daysUntil(a.nextDue)??1e9)-(daysUntil(b.nextDue)??1e9));
  const bizChips=`<button class="chip ${filters.biz==='all'?'active':''}" data-biz-filter="all">All businesses</button>`+
    state.businesses.map(b=>`<button class="chip ${filters.biz===b.id?'active':''}" data-biz-filter="${b.id}">${escapeHTML(b.name)}</button>`).join('');
  return `
    <div class="page-head">
      <div><div class="page-title">Payments</div><div class="page-sub">Recurring payments — insurance, utilities, anything that comes due on a schedule. Mark paid and the next due date advances automatically.</div></div>
      <div class="page-actions"><div class="search-box"><input type="text" placeholder="Search payments…" value="${escapeHTML(filters.search)}" data-search></div><button class="btn btn-accent" onclick="openPaymentForm()">＋ New payment</button></div>
    </div>
    ${state.businesses.length>1?`<div class="toolbar"><div class="chips">${bizChips}</div></div>`:''}
    <div class="card">
      ${rows.length?`<div class="table-wrap"><table><thead><tr><th>Payment</th><th>Business</th><th>Amount</th><th>Frequency</th><th>Next due</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(renderPayRow).join('')}</tbody></table></div>`:`<div class="empty"><div class="empty-title">No payments yet</div><div class="empty-msg">Add recurring payments like insurance, EWA, or any monthly bills.</div><button class="btn btn-accent" onclick="openPaymentForm()">＋ Add a payment</button></div>`}
    </div>
  `;
}
function renderPayRow(p){
  const biz=state.businesses.find(b=>b.id===p.businessId);
  const s=statusFor(daysUntil(p.nextDue));
  return `<tr>
    <td><div class="t-name">${escapeHTML(p.name)}</div>${p.notes?`<div class="t-sub">${escapeHTML(p.notes.slice(0,60))}${p.notes.length>60?'…':''}</div>`:''}</td>
    <td>${biz?escapeHTML(biz.name):'<span style="color:var(--muted)">—</span>'}</td>
    <td class="t-mono">${formatMoney(p.amount)}</td>
    <td>${labelPeriod(p.frequency)}</td>
    <td>${p.nextDue?fmtDate(p.nextDue):'<span style="color:var(--muted)">—</span>'}</td>
    <td>${p.nextDue?`<span class="pill ${s.key}">${s.label}</span>`:'<span class="pill gray">—</span>'}</td>
    <td><div class="t-actions"><button class="btn btn-sm" data-paid="${p.id}">Mark paid</button><button class="btn btn-sm btn-ghost" data-edit-pay="${p.id}">Edit</button><button class="btn btn-sm btn-ghost btn-danger" data-del-pay="${p.id}">✕</button></div></td>
  </tr>`;
}
function openPaymentForm(p){
  const isEdit=!!p;
  p=p||{name:'',businessId:state.businesses[0]?.id||'',amount:'',frequency:'monthly',nextDue:'',notes:''};
  openModal({
    title:isEdit?'Edit payment':'New payment',
    body:`
      <div class="form-row"><label class="form-label">Payment name</label><input type="text" id="f-name" value="${escapeHTML(p.name||'')}" placeholder="e.g. Social Insurance (GOSI)"></div>
      <div class="form-row"><label class="form-label">Linked to business</label><select id="f-biz"><option value="">— None —</option>${state.businesses.map(b=>`<option value="${b.id}" ${p.businessId===b.id?'selected':''}>${escapeHTML(b.name)}</option>`).join('')}</select></div>
      <div class="form-grid">
        <div class="form-row"><label class="form-label">Amount (BHD)</label><input type="number" id="f-amount" step="0.001" value="${p.amount||''}" placeholder="0.000"></div>
        <div class="form-row"><label class="form-label">Frequency</label><select id="f-freq">${['monthly','biannual','yearly','2years'].map(f=>`<option value="${f}" ${p.frequency===f?'selected':''}>${labelPeriod(f)}</option>`).join('')}</select></div>
        <div class="form-row" style="grid-column:1/-1"><label class="form-label">Next due date</label><input type="date" id="f-due" value="${p.nextDue||''}"></div>
      </div>
      <div class="form-row"><label class="form-label">Notes</label><textarea id="f-notes" placeholder="Optional notes">${escapeHTML(p.notes||'')}</textarea></div>
      ${isEdit&&(p.history||[]).length?`<details style="margin-top:18px"><summary style="cursor:pointer;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:0.06em;text-transform:uppercase">Payment history (${p.history.length})</summary><div style="margin-top:10px;font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px">${p.history.slice().reverse().map(h=>`<div style="display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:6px 0"><span>${escapeHTML(h.action)}</span><span style="color:var(--muted)">${fmtDate(h.date)}</span></div>`).join('')}</div></details>`:''}
    `,
    actions:[
      isEdit?{label:'Delete',cls:'btn-danger btn-ghost',handler:()=>{closeModal();confirmDialog('Delete this payment?','This will permanently remove the payment record.',()=>deletePayment(p.id))}}:null,
      {label:'Cancel',cls:'btn-ghost',handler:closeModal},
      {label:isEdit?'Save changes':'Add payment',cls:'btn-accent',handler:()=>{
        const data={id:p.id,name:val('f-name'),businessId:val('f-biz'),amount:val('f-amount'),frequency:val('f-freq'),nextDue:val('f-due'),notes:val('f-notes')};
        if(!data.name) return toast('Name is required');
        savePayment(data);closeModal();toast(isEdit?'Saved':'Payment added');
      }}
    ].filter(Boolean)
  });
}

/* =========================================================
   SETTINGS
   ========================================================= */
function renderSettings(){
  return `
    <div class="page-head"><div><div class="page-title">Settings</div><div class="page-sub">Manage your data. Everything is stored locally in your browser — export regularly to keep a backup. PDFs and contracts are included in the backup file.</div></div></div>
    <div class="card" style="max-width:760px">
      <div class="card-head"><div class="card-title">Backup & restore</div></div>
      <div class="setting-row"><div><div class="setting-label">Export everything</div><div class="setting-desc">Download a single JSON file containing all businesses, employees, payments, contracts, and attached PDFs.</div></div><button class="btn btn-accent" onclick="exportData()">Download backup</button></div>
      <div class="setting-row"><div><div class="setting-label">Restore from backup</div><div class="setting-desc">Load a backup file. This replaces all current data and PDFs.</div></div><label class="btn">Choose file<input type="file" accept="application/json" onchange="importData(this.files[0])" style="display:none"></label></div>
    </div>
    <div class="card" style="max-width:760px;margin-top:20px">
      <div class="card-head"><div class="card-title">Security</div></div>
      <div class="setting-row"><div><div class="setting-label">Change PIN</div><div class="setting-desc">Set a new 4-digit PIN. You'll need to enter it every time you open the app.</div></div><button class="btn" onclick="showPinScreen('change')">Change PIN</button></div>
    </div>
    <div class="card" style="max-width:760px;margin-top:20px">
      <div class="card-head"><div class="card-title" style="color:var(--red)">Danger zone</div></div>
      <div class="setting-row"><div><div class="setting-label">Reset everything</div><div class="setting-desc">Delete all data and PDFs. No undo — export a backup first.</div></div><button class="btn btn-danger" onclick="confirmDialog('Erase all data?','This permanently deletes every business, employee, payment, contract, and PDF. Cannot be undone.',resetAll)">Reset all data</button></div>
    </div>
    <div style="margin-top:30px;font-size:12.5px;color:var(--muted);max-width:760px;line-height:1.6"><strong style="color:var(--ink-2)">About your data:</strong> This app runs entirely in your browser. Nothing is sent over the internet. PDFs live in IndexedDB; everything else in localStorage. To move to another device, export the backup, open the HTML file there, and import.</div>
  `;
}
async function resetAll(){
  for(const b of state.businesses){if(b.crFile)try{await deleteFileFromDB(b.crFile.key)}catch(e){}}
  for(const e of state.employees){if(e.permitFile)try{await deleteFileFromDB(e.permitFile.key)}catch(err){}}
  state=JSON.parse(JSON.stringify(defaultState));save();render();toast('All data cleared');
}
async function exportData(){
  toast('Preparing backup…');
  const out={businesses:state.businesses,employees:state.employees,payments:state.payments,files:{}};
  const allFiles=[];
  state.businesses.forEach(b=>{if(b.crFile)allFiles.push(b.crFile.key)});
  state.employees.forEach(e=>{if(e.permitFile)allFiles.push(e.permitFile.key)});
  for(const k of allFiles){
    try{const blob=await getFile(k);if(blob){out.files[k]={data:await blobToBase64(blob),type:blob.type}}}catch(e){console.error(e)}
  }
  const blob=new Blob([JSON.stringify(out)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='ledger-backup-'+todayISO()+'.json';a.click();
  URL.revokeObjectURL(url);toast('Backup downloaded ('+fmtFileSize(blob.size)+')');
}
function blobToBase64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
function base64ToBlob(b64,type){const bin=atob(b64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:type||'application/pdf'})}
async function importData(file){
  if(!file) return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data.businesses||!data.employees||!data.payments) throw new Error('Invalid');
      if(!confirm('Replace ALL current data and PDFs with this backup?')) return;
      await resetAll();
      state.businesses=data.businesses||[];state.employees=data.employees||[];state.payments=data.payments||[];
      if(data.files){for(const k of Object.keys(data.files)){const blob=base64ToBlob(data.files[k].data,data.files[k].type);await putFile(k,blob)}}
      save();render();toast('Backup restored');
    }catch(e){console.error(e);toast('Could not read this file')}
  };
  r.readAsText(file);
}

/* =========================================================
   MODAL / TOAST / EVENT BINDING
   ========================================================= */
function openModal({title,body,actions,wide}){
  const ov=document.getElementById('overlay');
  ov.innerHTML=`<div class="modal" style="${wide?'max-width:720px':''}">
    <div class="modal-head"><div class="modal-title">${escapeHTML(title)}</div><button class="btn btn-icon btn-ghost" onclick="closeModal()" aria-label="Close">✕</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>`;
  const foot=ov.querySelector('#modal-foot');
  actions.forEach(a=>{const btn=document.createElement('button');btn.className='btn '+(a.cls||'');btn.textContent=a.label;btn.onclick=a.handler;foot.appendChild(btn)});
  ov.classList.add('open');
  setTimeout(()=>{const i=ov.querySelector('input:not([type=file]):not([type=checkbox]),select,textarea');if(i) i.focus()},80);
}
function closeModal(){document.getElementById('overlay').classList.remove('open')}
function confirmDialog(title,msg,onYes){
  openModal({title,body:`<div class="confirm-icon">!</div><div style="font-size:14px;color:var(--ink-2);line-height:1.6">${escapeHTML(msg)}</div>`,actions:[{label:'Cancel',cls:'btn-ghost',handler:closeModal},{label:'Yes, do it',cls:'btn-danger',handler:()=>{closeModal();onYes()}}]});
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400)}

function bindViewEvents(){
  document.querySelectorAll('[data-search]').forEach(el=>{
    el.addEventListener('input',e=>{filters.search=e.target.value;render();setTimeout(()=>{const inp=document.querySelector('[data-search]');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}},10)});
  });
  document.querySelectorAll('[data-biz-filter]').forEach(el=>el.addEventListener('click',()=>{filters.biz=el.dataset.bizFilter;render()}));
  document.querySelectorAll('[data-renew-biz]').forEach(el=>el.addEventListener('click',()=>renewBusiness(el.dataset.renewBiz)));
  document.querySelectorAll('[data-edit-biz]').forEach(el=>el.addEventListener('click',()=>{const b=state.businesses.find(x=>x.id===el.dataset.editBiz);openBusinessForm(b)}));
  document.querySelectorAll('[data-del-biz]').forEach(el=>el.addEventListener('click',()=>{const b=state.businesses.find(x=>x.id===el.dataset.delBiz);confirmDialog('Delete '+(b?.name||'this business')+'?','This will remove the business record and its CR document.',()=>deleteBusiness(el.dataset.delBiz))}));
  document.querySelectorAll('[data-edit-emp]').forEach(el=>el.addEventListener('click',()=>{const e=state.employees.find(x=>x.id===el.dataset.editEmp);openEmployeeForm(e)}));
  document.querySelectorAll('[data-del-emp]').forEach(el=>el.addEventListener('click',()=>{const e=state.employees.find(x=>x.id===el.dataset.delEmp);confirmDialog('Remove '+(e?.name||'this employee')+'?','This permanently removes the employee, attached permit, and contracts.',()=>deleteEmployee(el.dataset.delEmp))}));
  document.querySelectorAll('[data-edit-pay]').forEach(el=>el.addEventListener('click',()=>{const p=state.payments.find(x=>x.id===el.dataset.editPay);openPaymentForm(p)}));
  document.querySelectorAll('[data-del-pay]').forEach(el=>el.addEventListener('click',()=>{const p=state.payments.find(x=>x.id===el.dataset.delPay);confirmDialog('Delete '+(p?.name||'this payment')+'?','This permanently removes the payment record.',()=>deletePayment(el.dataset.delPay))}));
  document.querySelectorAll('[data-paid]').forEach(el=>el.addEventListener('click',()=>markPaid(el.dataset.paid)));
  document.querySelectorAll('[data-renew]').forEach(el=>el.addEventListener('click',()=>{const i=allItems().find(x=>x.id===el.dataset.renew);if(i) i.renew()}));
  document.querySelectorAll('[data-view-item]').forEach(el=>el.addEventListener('click',()=>{const i=allItems().find(x=>x.id===el.dataset.viewItem);if(i) i.view()}));
}

document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>switchView(n.dataset.view)));
document.getElementById('overlay').addEventListener('click',e=>{/* modal stays open — close only via Cancel or ✕ button */});
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeModal()});

function val(id){const el=document.getElementById(id);return el?el.value.trim():''}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}

switchView('dashboard');
</script>
</body>
</html>
